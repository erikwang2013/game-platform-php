name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax (admin)
        run: find admin -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors' | grep . && exit 1 || true

      - name: Check PHP syntax (service)
        run: find service -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors' | grep . && exit 1 || true

      - name: Check model drift (admin vs service, strict)
        run: php scripts/check-model-drift.php --strict

  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Audit admin dependencies
        working-directory: admin
        run: |
          composer audit --no-interaction | tee /tmp/audit-admin.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] && ! grep -q 'No security vulnerability advisories found' /tmp/audit-admin.txt; then
            exit $code
          fi

      - name: Install service dependencies
        working-directory: service
        run: composer install --no-interaction --prefer-dist

      - name: Audit service dependencies
        working-directory: service
        run: |
          composer audit --no-interaction | tee /tmp/audit-service.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] && ! grep -q 'No security vulnerability advisories found' /tmp/audit-service.txt; then
            exit $code
          fi

  frontend-react:
    name: Frontend React (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tree:
          - admin/apps/react
          - apps/react
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: ${{ matrix.tree }}/package-lock.json

      # All four lockfiles pin `resolved` URLs to registry.npmmirror.com (a China
      # mirror). npm honours the lock's host -- `registry.npmjs.org` alone is a
      # no-op -- so force the host back to the official registry. Runners are
      # offshore; local dev keeps npmmirror. Scoped to this step only.
      - name: Install dependencies
        working-directory: ${{ matrix.tree }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: ${{ matrix.tree }}
        run: ./node_modules/.bin/tsc -b

      - name: Run tests
        working-directory: ${{ matrix.tree }}
        run: npm test

      # oxlint exits non-zero on errors only; warnings (8 at present) do not fail.
      # Do NOT add --deny-warnings.
      - name: Lint
        if: matrix.tree == 'admin/apps/react'
        working-directory: ${{ matrix.tree }}
        run: ./node_modules/.bin/oxlint src/

  frontend-angular:
    name: Frontend Angular (${{ matrix.tree }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tree:
          - admin/apps/angular
          - apps/angular
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
          cache: npm
          cache-dependency-path: ${{ matrix.tree }}/package-lock.json

      # Same mirror override as frontend-react -- see the comment there.
      - name: Install dependencies
        working-directory: ${{ matrix.tree }}
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_REPLACE_REGISTRY_HOST: always
        run: npm ci --no-audit --no-fund

      - name: Run tests
        working-directory: ${{ matrix.tree }}
        run: ./node_modules/.bin/ng test --watch=false

      - name: Build
        working-directory: ${{ matrix.tree }}
        run: ./node_modules/.bin/ng build

  phpunit-admin:
    name: Admin PHPUnit
    runs-on: ubuntu-latest
    needs: [php-syntax]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, pcntl, mbstring, gd, imagick, xml, dom, xmlwriter, openssl
          coverage: none

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: admin
        run: test -f .env || cp .env.example .env

      - name: Prepare test databases
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS \`game-platform\`; CREATE DATABASE IF NOT EXISTS \`game-platform-test\`;"
          mysql -h 127.0.0.1 -u root game-platform < install/install.sql
          mysql -h 127.0.0.1 -u root game-platform-test < install/install.sql

      - name: Run admin tests
        working-directory: admin
        run: vendor/bin/phpunit

  phpunit-service:
    name: Service PHPUnit
    runs-on: ubuntu-latest
    needs: [php-syntax]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, pcntl, mbstring, gd, xml, dom, xmlwriter, openssl
          coverage: none

      - name: Install service dependencies
        working-directory: service
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: service
        run: test -f .env || cp .env.example .env

      - name: Prepare test databases
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS \`game-platform\`; CREATE DATABASE IF NOT EXISTS \`game-platform-test\`;"
          mysql -h 127.0.0.1 -u root game-platform < install/install.sql
          mysql -h 127.0.0.1 -u root game-platform-test < install/install.sql

      - name: Run service tests
        working-directory: service
        run: vendor/bin/phpunit
