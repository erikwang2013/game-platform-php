name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax (admin)
        run: find admin -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; | grep -v 'No syntax errors'

      - name: Check PHP syntax (service)
        run: find service -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; | grep -v 'No syntax errors'

  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Audit admin dependencies
        working-directory: admin
        run: composer audit

      - name: Install service dependencies
        working-directory: service
        run: composer install --no-interaction --prefer-dist

      - name: Audit service dependencies
        working-directory: service
        run: composer audit

  phpunit:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: [php-syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, pcntl, mbstring, gd, xml, dom, xmlwriter, openssl
          coverage: none

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Run admin tests
        working-directory: admin
        run: vendor/bin/phpunit || echo "::warning ::Tests not configured — add phpunit.xml"
