name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-syntax:
    name: PHP Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check PHP syntax (admin)
        run: find admin -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors' | grep . && exit 1 || true

      - name: Check PHP syntax (service)
        run: find service -name '*.php' -not -path '*/vendor/*' -exec php -l {} \; 2>&1 | grep -v 'No syntax errors' | grep . && exit 1 || true

  composer-audit:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Audit admin dependencies
        working-directory: admin
        run: |
          composer audit --no-interaction | tee /tmp/audit-admin.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] && ! grep -q 'No security vulnerability advisories found' /tmp/audit-admin.txt; then
            exit $code
          fi

      - name: Install service dependencies
        working-directory: service
        run: composer install --no-interaction --prefer-dist

      - name: Audit service dependencies
        working-directory: service
        run: |
          composer audit --no-interaction | tee /tmp/audit-service.txt
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] && ! grep -q 'No security vulnerability advisories found' /tmp/audit-service.txt; then
            exit $code
          fi

  phpunit-admin:
    name: Admin PHPUnit
    runs-on: ubuntu-latest
    needs: [php-syntax]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, pcntl, mbstring, gd, xml, dom, xmlwriter, openssl
          coverage: none

      - name: Install admin dependencies
        working-directory: admin
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: admin
        run: test -f .env || cp .env.example .env

      - name: Prepare test databases
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS game-platform; CREATE DATABASE IF NOT EXISTS game-platform-test;"
          mysql -h 127.0.0.1 -u root game-platform < install/install.sql
          mysql -h 127.0.0.1 -u root game-platform-test < install/install.sql

      - name: Run admin tests
        working-directory: admin
        run: vendor/bin/phpunit

  phpunit-service:
    name: Service PHPUnit
    runs-on: ubuntu-latest
    needs: [php-syntax]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, redis, pcntl, mbstring, gd, xml, dom, xmlwriter, openssl
          coverage: none

      - name: Install service dependencies
        working-directory: service
        run: composer install --no-interaction --prefer-dist

      - name: Prepare env
        working-directory: service
        run: test -f .env || cp .env.example .env

      - name: Prepare test databases
        run: |
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS game-platform; CREATE DATABASE IF NOT EXISTS game-platform-test;"
          mysql -h 127.0.0.1 -u root game-platform < install/install.sql
          mysql -h 127.0.0.1 -u root game-platform-test < install/install.sql

      - name: Run service tests
        working-directory: service
        run: vendor/bin/phpunit
