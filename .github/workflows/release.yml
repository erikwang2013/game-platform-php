name: Release

# ⚠ 只允许**手动**触发（Actions → Release → Run workflow），**不要**加回 push 触发。
# 用户明令：「CI 不要在 GitHub 上自动发布」—— 每次 push main 就自动递增版本号、
# 自动打 tag、自动建 Release，意味着**推代码即发版**，没有二次确认的机会。
# 要发版时到 Actions 页面点一下；下面的递增/跳过逻辑原样保留。
#
# ⚠ 随带的一条纪律：**别手工 `git push origin v…` 打 tag** —— 那会绕过本工作流的
# 递增与跳空逻辑（自上次 tag 无新提交时它会跳过），版本号序列会因此错乱。
on:
  workflow_dispatch:

# 串行化：并发触发的 run 排队，避免两个 run 抢同一个版本号
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Incremental tag + release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          prev=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$prev" ]; then
            next="v1.0.0"
            prev=""
          else
            v=${prev#v}
            IFS='.' read -r major minor patch <<< "$v"
            patch=${patch:-0}
            next="v${major}.${minor}.$((patch + 1))"
          fi

          # 自上次 tag 无新提交则跳过，不重复发版
          if [ -n "$prev" ] && [ -z "$(git log "$prev"..HEAD --oneline)" ]; then
            echo "no new commits since $prev; skipping release"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$next"
          git push origin "$next"

          if [ -n "$prev" ]; then
            changelog=$(git log --oneline "$prev"..HEAD | head -50)
          else
            changelog=$(git log --oneline | head -50)
          fi
          gh release create "$next" --title "$next" --notes "$(printf '## Changes\n%s' "$changelog")"
          echo "released $next"
