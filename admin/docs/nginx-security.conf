# 用法: include 到 server { } 块中
# ============================================================

# --- 隐藏技术栈版本信息 ---
server_tokens off;
more_clear_headers 'Server' 'X-Powered-By';

# --- 请求体大小限制（与后端 SecurityFilter 10MB 一致） ---
client_max_body_size 10m;
client_body_buffer_size 128k;

# --- 请求头大小限制（防缓冲区溢出） ---
client_header_buffer_size 4k;
large_client_header_buffers 4 8k;

# --- 超时限制 ---
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# --- 限流（Nginx 层，与后端 RateLimit 互补） ---
# 每个 IP 每秒最多 30 请求，突发 10
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req zone=api burst=10 nodelay;

# 登录端点额外限制
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
location /api/v1/auth/login {
    limit_req zone=login burst=3 nodelay;
}

# --- 连接数限制 ---
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn perip 20;

# --- HTTPS 强制（生产环境） ---
# return 301 https://$host$request_uri;

# --- TLS 配置（生产环境） ---
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
# ssl_prefer_server_ciphers on;
# ssl_session_cache shared:SSL:10m;
# ssl_session_timeout 10m;

# --- HSTS（HTTPS 必开） ---
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- 安全头 ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# --- 禁止访问敏感文件 ---
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
    deny all;
    return 404;
}

# --- 禁止不安全的 HTTP 方法 ---
if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
    return 405;
}

# ============================================================
# X-Forwarded-For 的信任边界（部署前必读。本段**全是注释**，不产生任何生效指令）
# ============================================================
#
# 【现状与攻击面】
# 本文件与仓库根的 nginx.conf.template（:42、:49）都写：
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# $proxy_add_x_forwarded_for = 「客户端自带的 XFF 原样前置」+ $remote_addr，即**第一个元素由客户端说了算**。
# 而 webman 的 getRealIp()（vendor/workerman/webman-framework/src/Http/Request.php:217，safeMode 默认 true）
# 的判据是：对端是内网就信任 XFF 头，且**取第一个元素**。走 nginx 边缘时对端正是内网
# （容器网段/127.0.0.1 都落在私有段，isIntranetIp() 判 true）⇒ 客户端换一个头就换一个身份。
#
# 后果（都已在代码里核实，不是推论）：
#   1. IP 维度限流全部作废：service/app/middleware/RateLimit.php:32,46 与
#      admin/app/middleware/RateLimit.php:29 的键都是 rate_limit:<getRealIp()>:<route>；
#      验证码桶（按客户端 IP 归属，见 BaseController::captchaOk 的注释）同理。
#   2. **支付回调的可信来源 IP 白名单可被绕过**：service/app/api/v1/controller/PaymentController.php:65
#      用 getRealIp() 比对 CALLBACK_TRUSTED_IPS。M-Pesa 回调没有签名（同处注释：
#      「伪造回调即可免费入账」），它的 fail-closed 正落在这一行上 —— 头部可伪造 ⇒ 该闸可绕。
#   3. 风控与审计里的 IP 同样被污染：SecurityFilter、OperationLog、last_login_ip、提现单 client_ip 等。
#
# 【两种正解 —— 按拓扑二选一，别照抄】
#
#  拓扑 A：nginx 直接暴露（前面没有 CDN / 负载均衡 / 其它反向代理）
#    能信的最外层代理就是 nginx 自己看到的对端 ⇒ 只取 $remote_addr，并且**必须丢弃**客户端自带的 XFF
#    （不丢就还是信伪造头）：
#        proxy_set_header X-Forwarded-For $remote_addr;
#        proxy_set_header X-Real-IP       $remote_addr;
#    适用前提：80/443 直接面向公网，前面没有别的反代。
#
#  拓扑 B：nginx 前面有 CDN / 上游代理（Cloudflare、ALB、四层 LB…）
#    此时 $remote_addr 是**回源地址**不是客户端地址。正解是让 nginx 先把它改写成真实客户端
#    （ngx_http_realip_module，即「按可信代理列表从右往左截取」），此后的下游消费者
#    （含 $binary_remote_addr 限流区与 $proxy_add_x_forwarded_for）才重新有意义：
#        set_real_ip_from 173.245.48.0/20;   # 逐个列出**可信**代理/CDN 的回源网段
#        set_real_ip_from 10.0.0.0/8;        # 自建上游代理所在网段
#        real_ip_header    X-Forwarded-For;  # 从右往左跳过可信段，取第一个不可信地址
#        real_ip_recursive on;
#    ⚠ 改写之后仍不要用 $proxy_add_x_forwarded_for —— 它会把伪造链再前置一遍；统一用 $remote_addr。
#    ⚠ set_real_ip_from 只许列**你自己的**代理。把 0.0.0.0/0 或不可信的网段列进来，等于把信任边界还给客户端。
#
# 【代价：盲改成 $remote_addr 会在 CDN 拓扑下误杀全站】
#    拓扑 B 里 $remote_addr 是 **CDN 回源 IP** ⇒ 全部客户端被折叠成同一个桶：应用侧 Redis 限流
#    （默认 60 次/分钟/IP/路由）与验证码桶会一起误杀，**影响面是全站而不是攻击者**。
#    这是可用性事故，比头部可伪造更严重 —— 所以本文件与 nginx.conf.template **都刻意不改那一行**：
#    改法由部署拓扑决定，而拓扑不是本仓库能替你决定的。
#
# 【部署方必须先回答的问题（答完再改，别先改）】
#    1. 这套 nginx 前面有没有 CDN / 负载均衡 / 其它反向代理？有几层？
#    2. 若有：它们的回源 IP 段是什么、是否固定？能否在防火墙上只允许这些回源 IP 访问 nginx？
#       （最后这条比任何头部逻辑都可靠，是首选）
#    3. 若没有：确认 80/443 直接暴露公网，按拓扑 A 改，并同时丢掉客户端可注入的 XFF 头。
#
# ============================================================

# --- 反向代理到 webman ---
location / {
    # app = compose 服务名（容器内固定 8789）；裸机部署复制本段时改为 127.0.0.1:8789
    proxy_pass http://app:8789;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

