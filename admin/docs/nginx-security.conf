# --- 隐藏技术栈版本信息 ---
server_tokens off;
more_clear_headers 'Server' 'X-Powered-By';

# --- 请求体大小限制（与后端 SecurityFilter 10MB 一致） ---
client_max_body_size 10m;
client_body_buffer_size 128k;

# --- 请求头大小限制（防缓冲区溢出） ---
client_header_buffer_size 4k;
large_client_header_buffers 4 8k;

# --- 超时限制 ---
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 10s;

# --- 限流（Nginx 层，与后端 RateLimit 互补） ---
# 每个 IP 每秒最多 30 请求，突发 10
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
limit_req zone=api burst=10 nodelay;

# 登录端点额外限制
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/s;
location /api/auth/login {
    limit_req zone=login burst=3 nodelay;
}

# --- 连接数限制 ---
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_conn perip 20;

# --- HTTPS 强制（生产环境） ---
# return 301 https://$host$request_uri;

# --- TLS 配置（生产环境） ---
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
# ssl_prefer_server_ciphers on;
# ssl_session_cache shared:SSL:10m;
# ssl_session_timeout 10m;

# --- HSTS（HTTPS 必开） ---
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# --- 安全头 ---
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# --- 禁止访问敏感文件 ---
location ~ /\.(?!well-known) {
    deny all;
    return 404;
}

location ~* \.(?:sql|log|env|yml|yaml|bak|swp|old|dist)$ {
    deny all;
    return 404;
}

# --- 禁止不安全的 HTTP 方法 ---
if ($request_method !~ ^(GET|POST|PUT|DELETE|OPTIONS)$) {
    return 405;
}

# --- 反向代理到 webman ---
location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}

# --- 静态文件（Flutter Web build） ---
# location /static/ {
#     alias /path/to/flutter/build/;
#     expires 30d;
#     add_header Cache-Control "public, immutable";
# }

# --- Gzip 压缩 ---
gzip on;
gzip_min_length 1k;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
