name: game_platform
description: 全球游戏聚合平台
publish_to: 'none'
version: 1.0.0

environment:
  # 选图用 dart:js_interop + extension type（SDK 自带，不引插件依赖），语言特性需要 ≥3.3；
  # 取值与仓内唯一的另一棵 Flutter 树 admin/apps/flutter 对齐（pubspec.lock 已要求 ≥3.12.0）
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.2.2
  responsive_framework: ^1.4.0
  web_socket_channel: ^2.4.0
  url_launcher: ^6.3.1
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # 吉祥物「小骰」(Dicey)：docs/mascot.svg 经 rsvg-convert 转出的 PNG（1x/2x/3x）
  assets:
    - assets/
