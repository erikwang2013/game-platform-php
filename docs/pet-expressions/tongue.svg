<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 240 200" width="240" height="200" role="img" aria-label="Dicey · 吐舌头 Tongue Out"><title>Dicey · 吐舌头 Tongue Out</title><desc>Dicey 的 吐舌头 表情形态 · animated expression form</desc><style>
.ex-motion { animation: ex-sway 2.0s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
.ex-anim-tear { animation: ex-tear 1.8s ease-in infinite; transform-box: fill-box; transform-origin: center; }
