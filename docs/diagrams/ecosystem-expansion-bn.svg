<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans Bengali', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="gradNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="gradProvider" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <rect x="0" y="0" width="960" height="56" fill="url(#hdr)"/>
  <text x="480" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">গেম প্ল্যাটফর্ম v2.0 — ইকোসিস্টেম এক্সপ্যানশন</text>

  <!-- Phase 1: Provider Layer -->
  <rect x="30" y="76" width="440" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">পর্যায় ১: গেম Provider SDK</text>
  <rect x="50" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="145" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">GameProvider (অ্যাবস্ট্র্যাক্ট)</text><text x="145" y="152" text-anchor="middle" fill="#64748b" font-size="10">balance/bet/settle/refund</text>
  <rect x="260" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="355" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">ProviderAuth মিডলওয়্যার</text><text x="355" y="152" text-anchor="middle" fill="#64748b" font-size="10">HMAC-SHA256 + ৫ মিনিট উইন্ডো</text>
  <rect x="50" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="145" y="194" text-anchor="middle" fill="#1e40af" font-size="11">SelfProvider</text><text x="145" y="208" text-anchor="middle" fill="#64748b" font-size="10">ডাটাবেস ট্রানজেকশন (SELECT FOR UPDATE)</text>
  <rect x="260" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="355" y="194" text-anchor="middle" fill="#1e40af" font-size="11">ThirdPartyProvider</text><text x="355" y="208" text-anchor="middle" fill="#64748b" font-size="10">Guzzle HTTP + সিগনেচার</text>
  <rect x="50" y="230" width="400" height="35" rx="6" fill="#93c5fd"/><text x="250" y="244" text-anchor="middle" fill="#fff" font-size="12">GameSessionService — Redis হার্টবিট + ১৫ মিনিট অটো-সেটলমেন্ট</text>

  <!-- Phase 2: Operations -->
  <rect x="490" y="76" width="440" height="200" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#166534" font-size="15" font-weight="bold">পর্যায় ২: অপারেশন সাপোর্ট</text>
  <rect x="510" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="605" y="135" text-anchor="middle" fill="#14532d" font-size="12">টিকিট সিস্টেম</text><text x="605" y="150" text-anchor="middle" fill="#64748b" font-size="10">C-এন্ড: তৈরি/লিস্ট/রিপ্লাই</text><text x="605" y="163" text-anchor="middle" fill="#64748b" font-size="10">অ্যাডমিন: রিপ্লাই/ক্লোজ/অ্যাসাইন</text>
  <rect x="720" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="815" y="135" text-anchor="middle" fill="#14532d" font-size="12">ভেরিফিকেশন</text><text x="815" y="150" text-anchor="middle" fill="#64748b" font-size="10">ইমেইল + SMS ৬-অঙ্কের OTP</text><text x="815" y="163" text-anchor="middle" fill="#64748b" font-size="10">Redis ১০ মিনিট TTL</text>
  <rect x="510" y="185" width="400" height="45" rx="6" fill="#bbf7d0"/><text x="710" y="204" text-anchor="middle" fill="#14532d" font-size="12">PushService — FCM / APNs / হুয়াওয়ে পুশ</text><text x="710" y="252" text-anchor="middle" fill="#64748b" font-size="10">OAuth: +X (Twitter)/Microsoft/LinkedIn/GitHub (PKCE)</text><text x="710" y="218" text-anchor="middle" fill="#64748b" font-size="10">DeviceToken মডেল + NotificationService ইন্টিগ্রেশন</text>

  <!-- Phase 3: Engagement -->
  <rect x="30" y="296" width="440" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="250" y="320" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">পর্যায় ৩: ইউজার এনগেজমেন্ট</text>
  <rect x="50" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="145" y="358" text-anchor="middle" fill="#78350f" font-size="12">VIP সিস্টেম (৫ লেভেল)</text><text x="145" y="373" text-anchor="middle" fill="#64748b" font-size="10">অভিজ্ঞতা: টপ-আপ/লগইন/KYC/রেফারেল</text><text x="145" y="386" text-anchor="middle" fill="#64748b" font-size="10">ডিসকাউন্ট: বিনিময় 2-15% / ফি 10-100%</text>
  <rect x="260" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="355" y="358" text-anchor="middle" fill="#78350f" font-size="12">অ্যাচিভমেন্ট সিস্টেম</text><text x="355" y="373" text-anchor="middle" fill="#64748b" font-size="10">১২টি বিল্ট-ইন অ্যাচিভমেন্ট</text><text x="355" y="386" text-anchor="middle" fill="#64748b" font-size="10">ইভেন্ট-ড্রিভেন + প্রোগ্রেস ট্র্যাকিং</text>
  <rect x="50" y="410" width="400" height="55" rx="6" fill="#fde68a"/><text x="250" y="430" text-anchor="middle" fill="#78350f" font-size="12">VipService: অভিজ্ঞতা সঞ্চয় + অটো-আপগ্রেড + বেনিফিট ক্যালকুলেশন</text><text x="250" y="445" text-anchor="middle" fill="#64748b" font-size="10">AchievementService: কন্ডিশন চেক (কাউন্ট/সাম/ডিডুপ/স্ট্রিক)</text>
  <text x="250" y="468" text-anchor="middle" fill="#92400e" font-size="11" font-style="italic">ExchangeController / WithdrawController — VIP ডিসকাউন্ট ইন্টিগ্রেশন</text>

  <!-- Phase 4: Social -->
  <rect x="490" y="296" width="440" height="180" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <text x="710" y="320" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="bold">পর্যায় ৪: সোশ্যাল লেয়ার</text>
  <rect x="510" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="605" y="358" text-anchor="middle" fill="#831843" font-size="12">ফ্রেন্ড সিস্টেম</text><text x="605" y="373" text-anchor="middle" fill="#64748b" font-size="10">রিকোয়েস্ট/অ্যাকসেপ্ট/রিজেক্ট/ডিলিট</text><text x="605" y="386" text-anchor="middle" fill="#64748b" font-size="10">পেন্ডিং/অ্যাকসেপ্টেড/ব্ল্যাকলিস্টেড</text>
  <rect x="720" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="815" y="358" text-anchor="middle" fill="#831843" font-size="12">চ্যাট মেসেজ</text><text x="815" y="373" text-anchor="middle" fill="#64748b" font-size="10">REST + WebSocket :8790</text><text x="815" y="386" text-anchor="middle" fill="#64748b" font-size="10">শুধু ফ্রেন্ডরাই মেসেজ পাঠাতে পারে</text>
  <rect x="510" y="410" width="400" height="55" rx="6" fill="#f9a8d4"/><text x="710" y="430" text-anchor="middle" fill="#831843" font-size="12">ChatWebSocket প্রসেস — workerman WebSocket + Redis Pub/Sub</text><text x="710" y="445" text-anchor="middle" fill="#64748b" font-size="10">game_friend টেবিল + game_message টেবিল</text>

  <!-- Phase 5: Infrastructure -->
  <rect x="30" y="496" width="900" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="520" text-anchor="middle" fill="#334155" font-size="15" font-weight="bold">পর্যায় ৫ + P2/P3 এক্সটেনশন</text>
  <rect x="50" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="185" y="558" text-anchor="middle" fill="#334155" font-size="12">EventBus (Redis Pub/Sub)</text><text x="185" y="573" text-anchor="middle" fill="#64748b" font-size="10">user.registered / deposit.completed / game.played</text>
  <rect x="345" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="480" y="558" text-anchor="middle" fill="#334155" font-size="12">অ্যাডভান্সড অ্যানালিটিক্স (ClickHouse)</text><text x="480" y="573" text-anchor="middle" fill="#64748b" font-size="10">রিটেনশন D1-D30 / ফানেল / ARPU / ইকোনমি</text>
  <rect x="640" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="775" y="558" text-anchor="middle" fill="#334155" font-size="12">FeatureFlag (ডাটাবেস-ভিত্তিক)</text><text x="775" y="573" text-anchor="middle" fill="#64748b" font-size="10">tournament / chat / vip / achievements</text>
  <rect x="50" y="600" width="860" height="27" rx="6" fill="#94a3b8"/><text x="480" y="618" text-anchor="middle" fill="#fff" font-size="12">+১০ নতুন টেবিল  |  +৫১ নতুন ফাইল  |  ০ নতুন ডিপেন্ডেন্সি  |  BC Math ৮-অঙ্ক প্রিসিশন  |  সম্পূর্ণ ব্যাকওয়ার্ড-কম্প্যাটিবল</text>

  <!-- Database Summary -->
  <rect x="30" y="656" width="900" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="680" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">ডাটাবেস: ৪২ → ৫২ টেবিল</text>
  <text x="480" y="700" text-anchor="middle" fill="#64748b" font-size="11">নতুন: game_ticket, game_ticket_reply, game_device_token, game_vip_level, game_user_vip, game_exp_log, game_achievement, game_user_achievement, game_friend, game_message</text>
  <text x="480" y="716" text-anchor="middle" fill="#64748b" font-size="11">পরিবর্তন: game_game (+provider_config JSON), game_game_play_log (+round_id, +bet_amount, +win_amount)</text>

  <!-- Footer -->
  <rect x="0" y="750" width="960" height="50" fill="#7c3aed"/>
  <text x="480" y="775" text-anchor="middle" fill="#ddd6fe" font-size="12">Copyright (c) 2026 erik — https://erik.xyz | গেম প্ল্যাটফর্ম v2.0 ইকোসিস্টেম</text>
  <text x="480" y="792" text-anchor="middle" fill="#a78bfa" font-size="10">৫টি পর্যায় · ১৬টি ফিচার · ১২টি টেবিল · শূন্য নতুন থার্ড-পার্টি ডিপেন্ডেন্সি</text>
</svg>
