<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans Devanagari', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="gradNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="gradProvider" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <rect x="0" y="0" width="960" height="56" fill="url(#hdr)"/>
  <text x="480" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">गेम प्लेटफ़ॉर्म v2.0 — पारिस्थितिकी विस्तार</text>

  <!-- Phase 1: Provider Layer -->
  <rect x="30" y="76" width="440" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">चरण 1: गेम Provider SDK</text>
  <rect x="50" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="145" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">GameProvider (अमूर्त)</text><text x="145" y="152" text-anchor="middle" fill="#64748b" font-size="10">balance/bet/settle/refund</text>
  <rect x="260" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="355" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">ProviderAuth मिडलवेयर</text><text x="355" y="152" text-anchor="middle" fill="#64748b" font-size="10">HMAC-SHA256 + 5 मिनट विंडो</text>
  <rect x="50" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="145" y="194" text-anchor="middle" fill="#1e40af" font-size="11">SelfProvider</text><text x="145" y="208" text-anchor="middle" fill="#64748b" font-size="10">डेटाबेस ट्रांज़ेक्शन (SELECT FOR UPDATE)</text>
  <rect x="260" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="355" y="194" text-anchor="middle" fill="#1e40af" font-size="11">ThirdPartyProvider</text><text x="355" y="208" text-anchor="middle" fill="#64748b" font-size="10">Guzzle HTTP + हस्ताक्षर</text>
  <rect x="50" y="230" width="400" height="35" rx="6" fill="#93c5fd"/><text x="250" y="244" text-anchor="middle" fill="#fff" font-size="12">GameSessionService — Redis हार्टबीट + 15 मिनट स्वचालित निपटान</text>

  <!-- Phase 2: Operations -->
  <rect x="490" y="76" width="440" height="200" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#166534" font-size="15" font-weight="bold">चरण 2: संचालन समर्थन</text>
  <rect x="510" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="605" y="135" text-anchor="middle" fill="#14532d" font-size="12">टिकट प्रणाली</text><text x="605" y="150" text-anchor="middle" fill="#64748b" font-size="10">C-छोर: निर्माण/सूची/उत्तर</text><text x="605" y="163" text-anchor="middle" fill="#64748b" font-size="10">प्रशासन: उत्तर/बंद/असाइन</text>
  <rect x="720" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="815" y="135" text-anchor="middle" fill="#14532d" font-size="12">सत्यापन</text><text x="815" y="150" text-anchor="middle" fill="#64748b" font-size="10">ईमेल + SMS 6-अंकीय सत्यापन कोड</text><text x="815" y="163" text-anchor="middle" fill="#64748b" font-size="10">Redis 10 मिनट TTL</text>
  <rect x="510" y="185" width="400" height="45" rx="6" fill="#bbf7d0"/><text x="710" y="204" text-anchor="middle" fill="#14532d" font-size="12">PushService — FCM / APNs / हुआवेई पुश</text><text x="710" y="252" text-anchor="middle" fill="#64748b" font-size="10">OAuth: +X(Twitter)/Microsoft/LinkedIn/GitHub (PKCE)</text><text x="710" y="218" text-anchor="middle" fill="#64748b" font-size="10">DeviceToken मॉडल + NotificationService एकीकरण</text>

  <!-- Phase 3: Engagement -->
  <rect x="30" y="296" width="440" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="250" y="320" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">चरण 3: उपयोगकर्ता सहभागिता</text>
  <rect x="50" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="145" y="358" text-anchor="middle" fill="#78350f" font-size="12">VIP प्रणाली (5 स्तर)</text><text x="145" y="373" text-anchor="middle" fill="#64748b" font-size="10">अनुभव: रिचार्ज/लॉगिन/KYC/रेफरल</text><text x="145" y="386" text-anchor="middle" fill="#64748b" font-size="10">छूट: विनिमय 2-15% / शुल्क 10-100%</text>
  <rect x="260" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="355" y="358" text-anchor="middle" fill="#78350f" font-size="12">उपलब्धि प्रणाली</text><text x="355" y="373" text-anchor="middle" fill="#64748b" font-size="10">12 अंतर्निहित उपलब्धियाँ</text><text x="355" y="386" text-anchor="middle" fill="#64748b" font-size="10">इवेंट-संचालित + प्रगति ट्रैकिंग</text>
  <rect x="50" y="410" width="400" height="55" rx="6" fill="#fde68a"/><text x="250" y="430" text-anchor="middle" fill="#78350f" font-size="12">VipService: अनुभव संचय + स्वचालित उन्नयन + लाभ गणना</text><text x="250" y="445" text-anchor="middle" fill="#64748b" font-size="10">AchievementService: शर्त निर्धारण (गणना/योग/डीडुप/निरंतर)</text>
  <text x="250" y="468" text-anchor="middle" fill="#92400e" font-size="11" font-style="italic">ExchangeController / WithdrawController — VIP छूट एकीकरण</text>

  <!-- Phase 4: Social -->
  <rect x="490" y="296" width="440" height="180" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <text x="710" y="320" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="bold">चरण 4: सोशल परत</text>
  <rect x="510" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="605" y="358" text-anchor="middle" fill="#831843" font-size="12">मित्र प्रणाली</text><text x="605" y="373" text-anchor="middle" fill="#64748b" font-size="10">अनुरोध/स्वीकार/अस्वीकार/हटाएँ</text><text x="605" y="386" text-anchor="middle" fill="#64748b" font-size="10">लंबित/स्वीकृत/ब्लैकलिस्टेड</text>
  <rect x="720" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="815" y="358" text-anchor="middle" fill="#831843" font-size="12">चैट संदेश</text><text x="815" y="373" text-anchor="middle" fill="#64748b" font-size="10">REST + WebSocket :8790</text><text x="815" y="386" text-anchor="middle" fill="#64748b" font-size="10">केवल मित्र संदेश भेज सकते हैं</text>
  <rect x="510" y="410" width="400" height="55" rx="6" fill="#f9a8d4"/><text x="710" y="430" text-anchor="middle" fill="#831843" font-size="12">ChatWebSocket प्रक्रिया — workerman WebSocket + Redis Pub/Sub</text><text x="710" y="445" text-anchor="middle" fill="#64748b" font-size="10">erik_friend तालिका + erik_message तालिका</text>

  <!-- Phase 5: Infrastructure -->
  <rect x="30" y="496" width="900" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="520" text-anchor="middle" fill="#334155" font-size="15" font-weight="bold">चरण 5 + P2/P3 विस्तार</text>
  <rect x="50" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="185" y="558" text-anchor="middle" fill="#334155" font-size="12">EventBus (Redis Pub/Sub)</text><text x="185" y="573" text-anchor="middle" fill="#64748b" font-size="10">user.registered / deposit.completed / game.played</text>
  <rect x="345" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="480" y="558" text-anchor="middle" fill="#334155" font-size="12">उन्नत विश्लेषण (ClickHouse)</text><text x="480" y="573" text-anchor="middle" fill="#64748b" font-size="10">प्रतिधारण D1-D30 / फ़नल / ARPU / अर्थव्यवस्था</text>
  <rect x="640" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="775" y="558" text-anchor="middle" fill="#334155" font-size="12">FeatureFlag (डेटाबेस-आधारित)</text><text x="775" y="573" text-anchor="middle" fill="#64748b" font-size="10">tournament / chat / vip / achievements</text>
  <rect x="50" y="600" width="860" height="27" rx="6" fill="#94a3b8"/><text x="480" y="618" text-anchor="middle" fill="#fff" font-size="12">+10 नई तालिकाएँ  |  +51 नई फ़ाइलें  |  0 नई निर्भरता  |  BC Math 8-अंकीय परिशुद्धता  |  पूर्ण रूप से पिछड़ा-संगत</text>

  <!-- Database Summary -->
  <rect x="30" y="656" width="900" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="680" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">डेटाबेस: 42 → 52 तालिकाएँ</text>
  <text x="480" y="700" text-anchor="middle" fill="#64748b" font-size="11">नई: erik_ticket, erik_ticket_reply, erik_device_token, erik_vip_level, erik_user_vip, erik_exp_log, erik_achievement, erik_user_achievement, erik_friend, erik_message</text>
  <text x="480" y="716" text-anchor="middle" fill="#64748b" font-size="11">संशोधित: erik_game (+provider_config JSON), erik_game_play_log (+round_id, +bet_amount, +win_amount)</text>

  <!-- Footer -->
  <rect x="0" y="750" width="960" height="50" fill="#7c3aed"/>
  <text x="480" y="775" text-anchor="middle" fill="#ddd6fe" font-size="12">Copyright (c) 2026 erik — https://erik.xyz | गेम प्लेटफ़ॉर्म v2.0 पारिस्थितिकी</text>
  <text x="480" y="792" text-anchor="middle" fill="#a78bfa" font-size="10">5 चरण · 16 सुविधाएँ · 12 तालिकाएँ · शून्य नई तृतीय-पक्ष निर्भरताएँ</text>
</svg>
