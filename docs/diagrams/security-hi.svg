<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans Devanagari', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="800" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">वैश्विक गेम एग्रीगेशन प्लेटफ़ॉर्म — सुरक्षा आर्किटेक्चर (18-परत गहराई रक्षा)</text>

  <!-- Layer 1-6 -->
  <rect x="15" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L1: CSP सामग्री सुरक्षा नीति</text>
  <text x="170" y="108" text-anchor="middle" fill="#ef4444" font-size="10">Content-Security-Policy प्रतिक्रिया हेडर</text>
  <text x="170" y="122" text-anchor="middle" fill="#ef4444" font-size="10">X-Permitted-Cross-Domain-Policies</text>

  <rect x="340" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L2: CORS क्रॉस-ऑरिजिन नियंत्रण</text>
  <text x="495" y="108" text-anchor="middle" fill="#ef4444" font-size="10">Access-Control-Allow-Origin श्वेतसूची</text>
  <text x="495" y="122" text-anchor="middle" fill="#ef4444" font-size="10">OPTIONS प्रीफ्लाइट अनुरोध प्रबंधन</text>

  <rect x="665" y="68" width="320" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L3: HTTP विधि श्वेतसूची</text>
  <text x="825" y="108" text-anchor="middle" fill="#ef4444" font-size="10">केवल GET/POST/PUT/DELETE/OPTIONS/HEAD अनुमत</text>
  <text x="825" y="122" text-anchor="middle" fill="#ef4444" font-size="10">गैर-मानक विधि 405 Method Not Allowed लौटाती है</text>

  <!-- L4-L6 -->
  <rect x="15" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L4: SecurityFilter आक्रमण अवरोधन</text>
  <text x="170" y="180" text-anchor="middle" fill="#dc2626" font-size="10">XSS / SQL इंजेक्शन / CSRF / पाथ ट्रैवर्सल</text>
  <text x="170" y="194" text-anchor="middle" fill="#dc2626" font-size="10">कमांड इंजेक्शन पहचान और अवरोधन</text>

  <rect x="340" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L5: RateLimit आवृत्ति सीमा</text>
  <text x="495" y="180" text-anchor="middle" fill="#dc2626" font-size="10">Redis स्लाइडिंग विंडो + Lua परमाणु</text>
  <text x="495" y="194" text-anchor="middle" fill="#dc2626" font-size="10">लॉगिन:10/मिनट पंजीकरण:5/मिनट सामान्य:60/मिनट</text>

  <rect x="665" y="140" width="320" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L6: API संस्करण नियंत्रण</text>
  <text x="825" y="180" text-anchor="middle" fill="#dc2626" font-size="10">API-Version अनुरोध हेडर सत्यापन</text>
  <text x="825" y="194" text-anchor="middle" fill="#dc2626" font-size="10">डिफ़ॉल्ट v1, बहु-संस्करण सह-अस्तित्व समर्थित</text>

  <!-- L7-L9 -->
  <rect x="15" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L7: JWT प्रमाणीकरण</text>
  <text x="170" y="252" text-anchor="middle" fill="#ea580c" font-size="10">erikwang2013/jwt-webman</text>
  <text x="170" y="266" text-anchor="middle" fill="#ea580c" font-size="10">access_token 2h + refresh_token 14d</text>

  <rect x="340" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L8: सत्र प्रबंधन</text>
  <text x="495" y="252" text-anchor="middle" fill="#ea580c" font-size="10">समवर्ती सत्र सीमा (अधिकतम 3 टोकन)</text>
  <text x="495" y="266" text-anchor="middle" fill="#ea580c" font-size="10">Token ब्लैकलिस्ट + स्वचालित निष्कासन</text>

  <rect x="665" y="212" width="320" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L9: खाता लॉक</text>
  <text x="825" y="252" text-anchor="middle" fill="#ea580c" font-size="10">5 असफल लॉगिन → 15 मिनट लॉक</text>
  <text x="825" y="266" text-anchor="middle" fill="#ea580c" font-size="10">Redis account_lock:{username} 900s</text>

  <!-- L10-L12 -->
  <rect x="15" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L10: RBAC अनुमति नियंत्रण</text>
  <text x="170" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">method.path ग्रेन्युलरिटी अनुमति सत्यापन</text>
  <text x="170" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">Redis 60s अनुमति कैश</text>

  <rect x="340" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L11: क्लिक कैप्चा</text>
  <text x="495" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">erikwang2013/poster-php</text>
  <text x="495" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">लॉगिन/पंजीकरण अनिवार्य मानव-मशीन सत्यापन</text>

  <rect x="665" y="284" width="320" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L12: ऑपरेशन ऑडिट</text>
  <text x="825" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">पूर्ण ऑपरेशन लॉग + 8 प्लेटफ़ॉर्म स्रोत पहचान</text>
  <text x="825" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">ipados/macos/windows/linux/ios/android/harmonyos/web</text>

  <!-- L13-L15 -->
  <rect x="15" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L13: परिवहन परत एन्क्रिप्शन</text>
  <text x="170" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryption</text>
  <text x="170" y="410" text-anchor="middle" fill="#22c55e" font-size="10">AES-256-CBC + SM4 राष्ट्रीय क्रिप्टो समर्थन</text>

  <rect x="340" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L14: भंडारण परत एन्क्रिप्शन</text>
  <text x="495" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryptable</text>
  <text x="495" y="410" text-anchor="middle" fill="#22c55e" font-size="10">संवेदनशील फ़ील्ड स्वचालित एन्क्रिप्ट/डिक्रिप्ट + कुंजी रोटेशन</text>

  <rect x="665" y="356" width="320" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L15: ID अपरिवर्तनीय</text>
  <text x="825" y="396" text-anchor="middle" fill="#22c55e" font-size="10">Snowflake जनरेशन + Hashids एन्कोडिंग</text>
  <text x="825" y="410" text-anchor="middle" fill="#22c55e" font-size="10">बाहरी रूप से ID से डेटा मात्रा/क्रम अनुमान नहीं किया जा सकता</text>

  <!-- L16-L18 -->
  <rect x="15" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L16: वॉलेट ऑप्टिमिस्टिक लॉक</text>
  <text x="170" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">version फ़ील्ड + समवर्ती अपडेट पहचान</text>
  <text x="170" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">समवर्ती डेबिट/डुप्लिकेट जमा रोकथाम</text>

  <rect x="340" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L17: भुगतान कॉलबैक हस्ताक्षर सत्यापन</text>
  <text x="495" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">Stripe Webhook हस्ताक्षर सत्यापन</text>
  <text x="495" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">PayPal IPN संदेश सत्यापन</text>

  <rect x="665" y="428" width="320" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L18: सटीक डेटा गणना</text>
  <text x="825" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">bcmath मनमानी परिशुद्धता गणित</text>
  <text x="825" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">decimal(18,4) वित्तीय-ग्रेड परिशुद्धता</text>

  <!-- Additional measures -->
  <rect x="15" y="504" width="970" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="526" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">पूरक सुरक्षा उपाय</text>

  <rect x="30" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="553" text-anchor="middle" fill="#475569" font-size="11">bcrypt पासवर्ड हैश (cost=12)</text>
  <rect x="220" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="553" text-anchor="middle" fill="#475569" font-size="11">पासवर्ड पुनः पुष्टि (संवेदनशील ऑपरेशन)</text>
  <rect x="410" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="553" text-anchor="middle" fill="#475569" font-size="11">security.txt RFC 9116</text>
  <rect x="600" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="553" text-anchor="middle" fill="#475569" font-size="11">Nginx सुरक्षा हार्डनिंग कॉन्फ़िगरेशन</text>
  <rect x="790" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="553" text-anchor="middle" fill="#475569" font-size="11">Prometheus मॉनिटरिंग मीट्रिक</text>

  <rect x="30" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="583" text-anchor="middle" fill="#475569" font-size="11">Docker कंटेनर अलगाव</text>
  <rect x="220" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="583" text-anchor="middle" fill="#475569" font-size="11">HTTPS/TLS परिवहन सुरक्षा</text>
  <rect x="410" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="583" text-anchor="middle" fill="#475569" font-size="11">डेटाबेस पासवर्ड .gitignore</text>
  <rect x="600" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="583" text-anchor="middle" fill="#475569" font-size="11">बैकअप एन्क्रिप्शन + 30 दिन प्रतिधारण</text>
  <rect x="790" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="583" text-anchor="middle" fill="#475569" font-size="11">CI/CD स्वचालित सुरक्षा जांच</text>

  <!-- Architecture flow -->
  <rect x="15" y="612" width="970" height="82" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="500" y="636" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">गहराई रक्षा आर्किटेक्चर (आक्रमण ट्रैफ़िक → परत-दर-परत फ़िल्टर)</text>
  <text x="60" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L1 CSP</text>
  <text x="120" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="145" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L2 CORS</text>
  <text x="200" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="225" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L3 Method</text>
  <text x="285" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="310" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L4 Filter</text>
  <text x="365" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="390" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L5 Limit</text>
  <text x="440" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="465" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L6 Version</text>
  <text x="525" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="550" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L7 JWT</text>
  <text x="600" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="625" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L8 Session</text>
  <text x="685" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="710" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L9 Lock</text>
  <text x="755" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="780" y="662" text-anchor="middle" fill="#22c55e" font-size="11">L10 RBAC</text>
  <text x="830" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="855" y="662" text-anchor="middle" fill="#22c55e" font-size="11">... L11-L18</text>
  <text x="935" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="950" y="662" text-anchor="middle" fill="#166534" font-size="11">OK</text>

  <text x="500" y="690" text-anchor="middle" fill="#991b1b" font-size="11">अनुरोध → CSP हेडर → CORS जांच → विधि श्वेतसूची → आक्रमण फ़िल्टर → दर सीमा → संस्करण सत्यापन → JWT प्रमाणीकरण → सत्र जांच → लॉक जांच → RBAC → ऑडिट लॉग → Controller</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="11">सुरक्षा घटक: erikwang2013/jwt-webman · erikwang2013/encryption · erikwang2013/encryptable · erikwang2013/security-php · erikwang2013/poster-php · erikwang2013/hashids</text>
  <text x="500" y="762" text-anchor="middle" fill="#94a3b8" font-size="11">अनुपालन: security.txt (RFC 9116) · Prometheus Metrics · ऑपरेशन ऑडिट लॉग · डेटा एन्क्रिप्शन (AES-256-CBC) · भुगतान अनुपालन (PCI-DSS)</text>
  <text x="500" y="790" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
