  <text x="610" y="336" text-anchor="middle" fill="#f97316" font-size="11">IPブラックリスト / 高額アラート</text>
  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">頻度検出 / 速度異常</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">国際化 i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">4言語 en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">翻訳テーブル + キャッシュ機構</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">通知センター</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">サイト内メッセージ + メール通知</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">チャージ/出金/KYC/クーポン</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
