  <text x="140" y="336" text-anchor="middle" fill="#10b981" font-size="11">固定金額 / 割引率</text>
  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">期間・数量限定 / 利用状況の追跡</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
