  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">チャージ注文の作成</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Stripe/PayPal コールバック署名検証</text>
  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">自動入金 + サイト内通知</text>

  <rect x="735" y="72" width="230" height="95" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
