  <text x="850" y="116" text-anchor="middle" fill="#ea580c" font-size="11">申請 → 審査 → 送金</text>
  <text x="850" y="135" text-anchor="middle" fill="#ea580c" font-size="11">全体スイッチ / KYC段階別限度額</text>
  <text x="850" y="154" text-anchor="middle" fill="#ea580c" font-size="11">自動審査しきい値を設定可能</text>

  <rect x="30" y="182" width="220" height="95" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sh)"/>
