  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">8カ国の決済/出金方法の設定</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">最低チャージ額の差別化</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">統計分析</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">日次統計スナップショット (5種の指標)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">プラットフォーム収益の追跡</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">全文検索</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Elasticsearch 検索</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">LIKE フォールバック + Scout 同期</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">プラットフォーム能力まとめ</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">ユーザー認証 · ウォレット(楽観ロック) · チャージ(Stripe/PayPal) · 交換(リアルタイム為替レート) · 出金(審査/自動) · KYC(三級認証)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">ゲームCRUD(10カテゴリ+サーバー) · ランキング(WebSocketリアルタイム) · クーポン · 紹介(登録ボーナス+コミッション) · リスク管理(4種のルール)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">通知(サイト内+メール) · 国別差別化(8カ国) · 国際化(4言語) · 統計(日次スナップショット+収益) · 全文検索(ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">三端クライアント: Flutter Admin (15ページ) + Flutter Platform (10ページ) + HarmonyOS (5ページ)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">デプロイ: Docker Compose 7サービス編成 + Nginxリバースプロキシ + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
