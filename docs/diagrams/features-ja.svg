  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">一意の紹介コード生成</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">登録ボーナス + チャージ返還コミッション</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
