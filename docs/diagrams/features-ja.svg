  <text x="140" y="245" text-anchor="middle" fill="#8b5cf6" font-size="11">リアルタイム見積もり / 為替レート管理</text>
  <text x="140" y="264" text-anchor="middle" fill="#8b5cf6" font-size="11">プラットフォーム抽成の差益収益</text>

  <rect x="265" y="182" width="220" height="95" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" filter="url(#sh)"/>
