<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, 'Noto Sans SC', 'Noto Sans JP', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="750" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">全球游戏聚合平台 — 機能全景図</text>

  <rect x="30" y="72" width="220" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="96" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">ユーザー認証</text>
  <text x="140" y="116" text-anchor="middle" fill="#3b82f6" font-size="11">ユーザー名/パスワード ログイン・登録</text>
  <text x="140" y="135" text-anchor="middle" fill="#3b82f6" font-size="11">Google/Facebook/Apple OAuth</text>
  <text x="140" y="154" text-anchor="middle" fill="#3b82f6" font-size="11">2FA TOTP 二段階認証</text>

  <rect x="265" y="72" width="220" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="96" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">ウォレットシステム</text>
  <text x="375" y="116" text-anchor="middle" fill="#ca8a04" font-size="11">プラットフォームコインウォレット (楽観ロックで並行対策)</text>
  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">ゲームコインウォレット (ゲームごとに独立)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">全リンクの取引履歴追跡記録</text>

