  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">日 / 週 / 月 / 総合ランキング</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Redis キャッシュ + リアルタイムソート</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">WebSocket リアルタイム配信 (:8789)</text>

