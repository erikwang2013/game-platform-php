  <text x="375" y="226" text-anchor="middle" fill="#ec4899" font-size="11">CRUD + 自社開発/サードパーティ種別</text>
  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">10大ゲームカテゴリ + サーバー管理</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">ゲーム記録の全プロセス追跡</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC 実名認証</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">実名認証の提出 + バックエンド審査</text>
  <text x="610" y="245" text-anchor="middle" fill="#ef4444" font-size="11">身分証 / パスポート / 運転免許証</text>
  <text x="610" y="264" text-anchor="middle" fill="#ef4444" font-size="11">三級認証レベルの体系</text>

  <rect x="735" y="182" width="230" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
