  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">일 / 주 / 월 / 누적 랭킹</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Redis 캐시 + 실시간 정렬</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">WebSocket 실시간 푸시 (:8789)</text>

  <rect x="30" y="292" width="220" height="95" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
