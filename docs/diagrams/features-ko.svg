  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">기한·수량 제한 / 수령·사용 추적</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="316" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">추천 시스템</text>
  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">고유 추천 코드 생성</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">등록 보상 + 충전 커미션</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="316" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="bold">리스크 관리</text>
