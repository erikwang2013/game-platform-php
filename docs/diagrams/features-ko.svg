<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, 'Noto Sans SC', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="750" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">글로벌 게임 통합 플랫폼 — 기능 전체 지도</text>

  <rect x="30" y="72" width="220" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="96" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">사용자 인증</text>
  <text x="140" y="116" text-anchor="middle" fill="#3b82f6" font-size="11">사용자 이름/비밀번호 로그인·등록</text>
  <text x="140" y="135" text-anchor="middle" fill="#3b82f6" font-size="11">Google/Facebook/Apple OAuth</text>
  <text x="140" y="154" text-anchor="middle" fill="#3b82f6" font-size="11">2FA TOTP 이중 인증</text>

  <rect x="265" y="72" width="220" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="96" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">지갑 시스템</text>
  <text x="375" y="116" text-anchor="middle" fill="#ca8a04" font-size="11">플랫폼 코인 지갑 (낙관적 잠금으로 동시성 방지)</text>
  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">게임 코인 지갑 (게임별 독립)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">전 링크 거래 내역 추적</text>

  <rect x="500" y="72" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="96" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">충전 시스템</text>
  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">충전 주문 생성</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Stripe/PayPal 콜백 서명 검증</text>
  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">자동 입금 + 사이트 내 알림</text>

