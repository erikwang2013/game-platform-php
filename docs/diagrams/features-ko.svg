  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">게임 카테고리 10개 + 구역 관리</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">게임 기록 전 과정 추적</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC 실명 인증</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">실명 인증 제출 + 백오피스 심사</text>
