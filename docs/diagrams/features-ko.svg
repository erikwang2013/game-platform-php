  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">빈도 감지 / 속도 이상</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">국제화 i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">4언어 en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">번역 테이블 + 캐시 메커니즘</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">알림 센터</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">사이트 내 메시지 + 이메일 알림</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">충전/출금/KYC/쿠폰</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="426" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">국가 차등화</text>
  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">8개국 결제/출금 방식 설정</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">최소 충전액 차등화</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">통계 분석</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">일별 통계 스냅샷 (지표 5종)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">플랫폼 수익 추적</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">전문 검색</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Elasticsearch 검색</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">LIKE 폴백 + Scout 동기화</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">플랫폼 능력 요약</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">사용자 인증 · 지갑(낙관적 잠금) · 충전(Stripe/PayPal) · 환전(실시간 환율) · 출금(심사/자동) · KYC(3단계 인증)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">게임 CRUD(10카테고리+구역) · 리더보드(WebSocket 실시간) · 쿠폰 · 추천(등록 보상+커미션) · 리스크(4종 규칙)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">알림(사이트 내+이메일) · 국가 차등화(8개국) · 국제화(4언어) · 통계(일 스냅샷+수익) · 전문 검색(ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">3단 클라이언트: Flutter Admin (15페이지) + Flutter Platform (10페이지) + HarmonyOS (5페이지)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">배포: Docker Compose 7서비스 오케스트레이션 + Nginx 리버스 프록시 + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
