<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="Arial, 'Noto Sans SC', 'Noto Sans Bengali', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4f46e5"/><stop offset="100%" stop-color="#6366f1"/></linearGradient>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>

  <rect x="0" y="0" width="960" height="56" fill="url(#hdr)"/>
  <text x="480" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">বিশ্বব্যাপী গেম প্ল্যাটফর্ম — সিস্টেম আর্কিটেকচার</text>

  <!-- Client -->
  <rect x="30" y="76" width="900" height="70" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="480" y="100" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">ক্লায়েন্ট লেয়ার</text>
  <rect x="60" y="110" width="130" height="26" rx="6" fill="#bbf7d0"/><text x="125" y="128" text-anchor="middle" fill="#14532d" font-size="12">Flutter Web (Admin)</text>
  <rect x="210" y="110" width="130" height="26" rx="6" fill="#bbf7d0"/><text x="275" y="128" text-anchor="middle" fill="#14532d" font-size="12">Flutter Web (Platform)</text>
  <rect x="360" y="110" width="130" height="26" rx="6" fill="#bbf7d0"/><text x="425" y="128" text-anchor="middle" fill="#14532d" font-size="12">HarmonyOS App</text>
  <rect x="510" y="110" width="130" height="26" rx="6" fill="#bbf7d0"/><text x="575" y="128" text-anchor="middle" fill="#14532d" font-size="12">থার্ড-পার্টি API</text>
  <rect x="660" y="110" width="130" height="26" rx="6" fill="#bbf7d0"/><text x="725" y="128" text-anchor="middle" fill="#14532d" font-size="12">গেম সার্ভার</text>
  <rect x="810" y="110" width="100" height="26" rx="6" fill="#bbf7d0"/><text x="860" y="128" text-anchor="middle" fill="#14532d" font-size="12">পেমেন্ট গেটওয়ে</text>

  <line x1="480" y1="148" x2="480" y2="176" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Nginx -->
  <rect x="280" y="178" width="400" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="480" y="204" text-anchor="middle" fill="#991b1b" font-size="14" font-weight="bold">Nginx রিভার্স প্রক্সি — পোর্ট 80/443</text>

  <line x1="370" y1="222" x2="260" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="222" x2="480" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="590" y1="222" x2="700" y2="260" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- App Layer -->
  <rect x="60" y="262" width="280" height="138" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="200" y="286" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Admin অ্যাডমিন প্যানেল :8787</text>
  <rect x="80" y="298" width="240" height="22" rx="4" fill="#dbeafe"/><text x="200" y="314" text-anchor="middle" fill="#1e3a5f" font-size="11">AuthController / CaptchaController</text>
  <rect x="80" y="326" width="240" height="22" rx="4" fill="#dbeafe"/><text x="200" y="342" text-anchor="middle" fill="#1e3a5f" font-size="11">২৭টি অ্যাডমিন কন্ট্রোলার (RBAC)</text>
  <rect x="80" y="354" width="240" height="22" rx="4" fill="#dbeafe"/><text x="200" y="370" text-anchor="middle" fill="#1e3a5f" font-size="11">৮-স্তরের মিডলওয়্যার চেইন</text>

  <rect x="360" y="262" width="240" height="138" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="480" y="286" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">Service C-এন্ড সার্ভিস :8788</text>
  <rect x="380" y="298" width="200" height="22" rx="4" fill="#fef9c3"/><text x="480" y="314" text-anchor="middle" fill="#713f12" font-size="11">২২টি API কন্ট্রোলার (v1)</text>
  <rect x="380" y="326" width="200" height="22" rx="4" fill="#fef9c3"/><text x="480" y="342" text-anchor="middle" fill="#713f12" font-size="11">LanguageMiddleware (i18n)</text>
  <rect x="380" y="354" width="200" height="22" rx="4" fill="#fef9c3"/><text x="480" y="370" text-anchor="middle" fill="#713f12" font-size="11">RiskService / NotificationService</text>

  <rect x="620" y="262" width="300" height="138" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="770" y="286" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">WebSocket সার্ভিস :8789</text>
  <rect x="640" y="298" width="260" height="22" rx="4" fill="#ede9fe"/><text x="770" y="314" text-anchor="middle" fill="#3b0764" font-size="11">LeaderboardWebSocket (রিয়েল-টাইম র্যাংকিং)</text>
  <rect x="640" y="326" width="260" height="22" rx="4" fill="#ede9fe"/><text x="770" y="342" text-anchor="middle" fill="#3b0764" font-size="11">সংযোগ পুল ম্যানেজমেন্ট</text>
  <rect x="640" y="354" width="260" height="22" rx="4" fill="#ede9fe"/><text x="770" y="370" text-anchor="middle" fill="#3b0764" font-size="11">Redis Pub/Sub মেসেজ রিলে</text>

  <line x1="200" y1="402" x2="200" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="402" x2="480" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="402" x2="770" y2="440" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Middleware -->
  <rect x="60" y="442" width="860" height="42" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="99" y="469" fill="#9a3412" font-size="12" font-weight="bold">মিডলওয়্যার চেইন:</text>
  <text x="175" y="469" fill="#431407" font-size="11">Cors → SecurityFilter → RateLimit → ApiVersion → AdminAuth(JWT) → AdminPermission(RBAC) → OperationLog → StaticFile</text>

  <line x1="200" y1="486" x2="200" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="486" x2="480" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="486" x2="770" y2="524" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Data -->
  <rect x="30" y="526" width="900" height="78" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="552" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">ডেটা লেয়ার</text>
  <rect x="60" y="564" width="150" height="30" rx="6" fill="#dbeafe"/><text x="135" y="584" text-anchor="middle" fill="#1e3a5f" font-size="12">MySQL 8.0 (প্রধান স্টোরেজ)</text>
  <rect x="230" y="564" width="140" height="30" rx="6" fill="#fce7f3"/><text x="300" y="584" text-anchor="middle" fill="#831843" font-size="12">Redis 7 (ক্যাশ/রেট লিমিট)</text>
  <rect x="390" y="564" width="160" height="30" rx="6" fill="#e0e7ff"/><text x="470" y="584" text-anchor="middle" fill="#312e81" font-size="12">ClickHouse (OLAP অ্যানালাইসিস)</text>
  <rect x="570" y="564" width="170" height="30" rx="6" fill="#ecfdf5"/><text x="655" y="584" text-anchor="middle" fill="#064e3b" font-size="12">Elasticsearch (ফুল-টেক্সট সার্চ)</text>
  <rect x="760" y="564" width="140" height="30" rx="6" fill="#fef2f2"/><text x="830" y="584" text-anchor="middle" fill="#7f1d1d" font-size="12">OpenSearch (বিকল্প)</text>

  <!-- Common -->
  <rect x="200" y="618" width="560" height="36" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,3"/>
  <text x="480" y="642" text-anchor="middle" fill="#475569" font-size="11">মডেল/শেয়ার্ড সার্ভিস (admin 46 + service 44) · Snowflake ID · Hashids · Encryption · Scout</text>

  <text x="480" y="705" text-anchor="middle" fill="#94a3b8" font-size="11">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt; — https://erik.xyz</text>
</svg>
