  <text x="850" y="135" text-anchor="middle" fill="#ea580c" font-size="11">গ্লোবাল সুইচ / KYC টায়ার্ড লিমিট</text>
  <text x="850" y="154" text-anchor="middle" fill="#ea580c" font-size="11">অটো-রিভিউ থ্রেশহোল্ড কনফিগযোগ্য</text>

  <rect x="30" y="182" width="220" height="95" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="206" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">বিনিময় ইঞ্জিন</text>
  <text x="140" y="226" text-anchor="middle" fill="#8b5cf6" font-size="11">প্ল্যাটফর্ম কয়েন ⇄ গেম কয়েন দুই-মুখী</text>
  <text x="140" y="245" text-anchor="middle" fill="#8b5cf6" font-size="11">রিয়েল-টাইম কোট / হার ম্যানেজমেন্ট</text>
  <text x="140" y="264" text-anchor="middle" fill="#8b5cf6" font-size="11">প্ল্যাটফর্ম কাটতি আয়</text>

  <rect x="265" y="182" width="220" height="95" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" filter="url(#sh)"/>
