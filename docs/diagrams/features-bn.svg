  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">অটো জমা + সাইট নোটিফিকেশন</text>

  <rect x="735" y="72" width="230" height="95" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
