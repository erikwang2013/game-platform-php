  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">গেম কয়েন ওয়ালেট (গেমভিত্তিক আলাদা)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">সম্পূর্ণ লেজার ট্র্যাকিং</text>

  <rect x="500" y="72" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="96" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">টপ-আপ সিস্টেম</text>
  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">টপ-আপ অর্ডার তৈরি</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Stripe/PayPal কলব্যাক সিগনেচার</text>
