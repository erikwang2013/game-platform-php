  <text x="375" y="226" text-anchor="middle" fill="#ec4899" font-size="11">CRUD + সেলফ/থার্ড-পার্টি টাইপ</text>
  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">১০টি গেম ক্যাটাগরি + সার্ভার</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">গেম রেকর্ড সম্পূর্ণ ট্র্যাকিং</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC রিয়েল-নেম ভেরিফিকেশন</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">ভেরিফিকেশন সাবমিট + ব্যাকএন্ড রিভিউ</text>
  <text x="610" y="245" text-anchor="middle" fill="#ef4444" font-size="11">আইডি কার্ড / পাসপোর্ট / ড্রাইভিং লাইসেন্স</text>
  <text x="610" y="264" text-anchor="middle" fill="#ef4444" font-size="11">তিন-স্তরের ভেরিফিকেশন লেভেল</text>

  <rect x="735" y="182" width="230" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="206" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">লিডারবোর্ড</text>
  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">দৈনিক / সাপ্তাহিক / মাসিক / মোট</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Redis ক্যাশ + রিয়েল-টাইম সর্ট</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">WebSocket রিয়েল-টাইম পুশ (:8789)</text>

  <rect x="30" y="292" width="220" height="95" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="316" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="bold">কুপন</text>
  <text x="140" y="336" text-anchor="middle" fill="#10b981" font-size="11">ফিক্সড পরিমাণ / শতাংশ ডিসকাউন্ট</text>
  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">সময়/সংখ্যা সীমা / ব্যবহার ট্র্যাকিং</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="316" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">রেফারেল সিস্টেম</text>
  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">ইউনিক রেফারেল কোড</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">রেজিস্ট্রেশন রিওয়ার্ড + টপ-আপ কমিশন</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="316" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="bold">রিস্ক কন্ট্রোল</text>
  <text x="610" y="336" text-anchor="middle" fill="#f97316" font-size="11">IP ব্ল্যাকলিস্ট / বড় অঙ্কের অ্যালার্ট</text>
  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">ফ্রিকোয়েন্সি / গতি অস্বাভাবিকতা</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">আন্তর্জাতিকীকরণ i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">৪ ভাষা en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">অনুবাদ টেবিল + ক্যাশ</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">নোটিফিকেশন সেন্টার</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">সাইট বার্তা + ইমেইল</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">টপ-আপ/উত্তোলন/KYC/কুপন</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="426" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">দেশভিত্তিক ভিন্নতা</text>
  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">৮ দেশের পেমেন্ট/উত্তোলন কনফিগ</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">সর্বনিম্ন টপ-আপ পরিমাণ ভিন্ন</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">পরিসংখ্যান বিশ্লেষণ</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">দৈনিক স্ন্যাপশট (৫ ধরনের মেট্রিক)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">প্ল্যাটফর্ম রেভিনিউ ট্র্যাকিং</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">ফুল-টেক্সট সার্চ</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Elasticsearch সার্চ</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">LIKE ফলব্যাক + Scout সিঙ্ক</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">প্ল্যাটফর্ম সক্ষমতার সারাংশ</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">ইউজার অথেনটিকেশন · ওয়ালেট(অপটিমিস্টিক লক) · টপ-আপ(Stripe/PayPal) · বিনিময়(রিয়েল-টাইম হার) · উত্তোলন(রিভিউ/অটো) · KYC(তিন-স্তর)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">গেম CRUD(১০ ক্যাটাগরি+সার্ভার) · লিডারবোর্ড(WebSocket রিয়েল-টাইম) · কুপন · রেফারেল(রিওয়ার্ড+কমিশন) · রিস্ক(৪ ধরনের নিয়ম)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">নোটিফিকেশন(সাইট+ইমেইল) · দেশভিত্তিক ভিন্নতা(৮ দেশ) · i18n(৪ ভাষা) · পরিসংখ্যান(দৈনিক+রেভিনিউ) · ফুল-টেক্সট সার্চ(ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">তিন ক্লায়েন্ট: Flutter Admin (১৫ পেজ) + Flutter Platform (১০ পেজ) + HarmonyOS (৫ পেজ)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">ডিপ্লয়মেন্ট: Docker Compose ৭ সার্ভিস + Nginx রিভার্স প্রক্সি + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
