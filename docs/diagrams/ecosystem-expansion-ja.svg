<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="gradNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="gradProvider" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <rect x="0" y="0" width="960" height="56" fill="url(#hdr)"/>
  <text x="480" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">游戏平台 v2.0 — エコシステム拡張</text>

  <!-- Phase 1: Provider Layer -->
  <rect x="30" y="76" width="440" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">フェーズ 1：ゲーム Provider SDK</text>
  <rect x="50" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="145" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">GameProvider（抽象）</text><text x="145" y="152" text-anchor="middle" fill="#64748b" font-size="10">balance/bet/settle/refund</text>
  <rect x="260" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="355" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">ProviderAuth ミドルウェア</text><text x="355" y="152" text-anchor="middle" fill="#64748b" font-size="10">HMAC-SHA256 + 5 分ウィンドウ</text>
  <rect x="50" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="145" y="194" text-anchor="middle" fill="#1e40af" font-size="11">SelfProvider</text><text x="145" y="208" text-anchor="middle" fill="#64748b" font-size="10">DBトランザクション（SELECT FOR UPDATE）</text>
  <rect x="260" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="355" y="194" text-anchor="middle" fill="#1e40af" font-size="11">ThirdPartyProvider</text><text x="355" y="208" text-anchor="middle" fill="#64748b" font-size="10">Guzzle HTTP + 署名</text>
  <rect x="50" y="230" width="400" height="35" rx="6" fill="#93c5fd"/><text x="250" y="244" text-anchor="middle" fill="#fff" font-size="12">GameSessionService — Redis ハートビート + 15 分自動決済</text>

  <!-- Phase 2: Operations -->
  <rect x="490" y="76" width="440" height="200" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#166534" font-size="15" font-weight="bold">フェーズ 2：運営サポート</text>
  <rect x="510" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="605" y="135" text-anchor="middle" fill="#14532d" font-size="12">チケットシステム</text><text x="605" y="150" text-anchor="middle" fill="#64748b" font-size="10">C端：作成/一覧/返信</text><text x="605" y="163" text-anchor="middle" fill="#64748b" font-size="10">管理端：返信/クローズ/割り当て</text>
  <rect x="720" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="815" y="135" text-anchor="middle" fill="#14532d" font-size="12">検証</text><text x="815" y="150" text-anchor="middle" fill="#64748b" font-size="10">メール + SMS 6桁検証コード</text><text x="815" y="163" text-anchor="middle" fill="#64748b" font-size="10">Redis 10分 TTL</text>
  <rect x="510" y="185" width="400" height="45" rx="6" fill="#bbf7d0"/><text x="710" y="204" text-anchor="middle" fill="#14532d" font-size="12">PushService — FCM / APNs / 華為プッシュ</text><text x="710" y="252" text-anchor="middle" fill="#64748b" font-size="10">OAuth：+X(Twitter)/Microsoft/LinkedIn/GitHub (PKCE)</text><text x="710" y="218" text-anchor="middle" fill="#64748b" font-size="10">DeviceToken モデル + NotificationService 統合</text>

  <!-- Phase 3: Engagement -->
  <rect x="30" y="296" width="440" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="250" y="320" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">フェーズ 3：ユーザーインタラクション</text>
  <rect x="50" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="145" y="358" text-anchor="middle" fill="#78350f" font-size="12">VIP システム（5 段階）</text><text x="145" y="373" text-anchor="middle" fill="#64748b" font-size="10">経験値：チャージ/ログイン/KYC/紹介</text><text x="145" y="386" text-anchor="middle" fill="#64748b" font-size="10">割引：交換 2-15% / 手数料 10-100%</text>
  <rect x="260" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="355" y="358" text-anchor="middle" fill="#78350f" font-size="12">成就システム</text><text x="355" y="373" text-anchor="middle" fill="#64748b" font-size="10">12 個の内蔵成就</text><text x="355" y="386" text-anchor="middle" fill="#64748b" font-size="10">イベント駆動 + 進捗追跡</text>
  <rect x="50" y="410" width="400" height="55" rx="6" fill="#fde68a"/><text x="250" y="430" text-anchor="middle" fill="#78350f" font-size="12">VipService：経験値累積 + 自動昇格 + 特典計算</text><text x="250" y="445" text-anchor="middle" fill="#64748b" font-size="10">AchievementService：条件判定（カウント/合計/重複除外/連続）</text>
  <text x="250" y="468" text-anchor="middle" fill="#92400e" font-size="11" font-style="italic">ExchangeController / WithdrawController — VIP 割引統合</text>

  <!-- Phase 4: Social -->
  <rect x="490" y="296" width="440" height="180" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <text x="710" y="320" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="bold">フェーズ 4：ソーシャル層</text>
  <rect x="510" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="605" y="358" text-anchor="middle" fill="#831843" font-size="12">フレンドシステム</text><text x="605" y="373" text-anchor="middle" fill="#64748b" font-size="10">リクエスト/承認/拒否/削除</text><text x="605" y="386" text-anchor="middle" fill="#64748b" font-size="10">未処理/承認済み/ブロック済み</text>
  <rect x="720" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="815" y="358" text-anchor="middle" fill="#831843" font-size="12">チャットメッセージ</text><text x="815" y="373" text-anchor="middle" fill="#64748b" font-size="10">REST + WebSocket :8790</text><text x="815" y="386" text-anchor="middle" fill="#64748b" font-size="10">フレンドのみメッセージ送信可</text>
  <rect x="510" y="410" width="400" height="55" rx="6" fill="#f9a8d4"/><text x="710" y="430" text-anchor="middle" fill="#831843" font-size="12">ChatWebSocket プロセス — workerman WebSocket + Redis Pub/Sub</text><text x="710" y="445" text-anchor="middle" fill="#64748b" font-size="10">game_friend テーブル + game_message テーブル</text>

  <!-- Phase 5: Infrastructure -->
  <rect x="30" y="496" width="900" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="520" text-anchor="middle" fill="#334155" font-size="15" font-weight="bold">フェーズ 5 + P2/P3 拡張</text>
  <rect x="50" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="185" y="558" text-anchor="middle" fill="#334155" font-size="12">EventBus（Redis Pub/Sub）</text><text x="185" y="573" text-anchor="middle" fill="#64748b" font-size="10">user.registered / deposit.completed / game.played</text>
  <rect x="345" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="480" y="558" text-anchor="middle" fill="#334155" font-size="12">高度な分析（ClickHouse）</text><text x="480" y="573" text-anchor="middle" fill="#64748b" font-size="10">リテンション D1-D30 / ファネル / ARPU / 経済</text>
  <rect x="640" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="775" y="558" text-anchor="middle" fill="#334155" font-size="12">FeatureFlag（データベースベース）</text><text x="775" y="573" text-anchor="middle" fill="#64748b" font-size="10">tournament / chat / vip / achievements</text>
  <rect x="50" y="600" width="860" height="27" rx="6" fill="#94a3b8"/><text x="480" y="618" text-anchor="middle" fill="#fff" font-size="12">+10 枚の新テーブル  |  +51 個の新ファイル  |  0 追加依存  |  BC Math 8桁精度  |  完全後方互換</text>

  <!-- Database Summary -->
  <rect x="30" y="656" width="900" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="680" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">データベース：42 → 52 枚のテーブル</text>
  <text x="480" y="700" text-anchor="middle" fill="#64748b" font-size="11">追加：game_ticket, game_ticket_reply, game_device_token, game_vip_level, game_user_vip, game_exp_log, game_achievement, game_user_achievement, game_friend, game_message</text>
  <text x="480" y="716" text-anchor="middle" fill="#64748b" font-size="11">変更：game_game（+provider_config JSON）、game_game_play_log（+round_id、+bet_amount、+win_amount）</text>

  <!-- Footer -->
  <rect x="0" y="750" width="960" height="50" fill="#7c3aed"/>
  <text x="480" y="775" text-anchor="middle" fill="#ddd6fe" font-size="12">Copyright (c) 2026 erik — https://erik.xyz | 游戏平台 v2.0 エコシステム</text>
  <text x="480" y="792" text-anchor="middle" fill="#a78bfa" font-size="10">5 つのフェーズ · 16 の機能 · 12 枚のテーブル · 追加のサードパーティ依存ゼロ</text>
</svg>
