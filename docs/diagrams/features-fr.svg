<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="750" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Plateforme mondiale d'agrégation de jeux — Vue d'ensemble des fonctionnalités</text>

  <rect x="30" y="72" width="220" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="96" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Authentification</text>
  <text x="140" y="116" text-anchor="middle" fill="#3b82f6" font-size="11">Connexion/inscription nom d'utilisateur + mot de passe</text>
  <text x="140" y="135" text-anchor="middle" fill="#3b82f6" font-size="11">OAuth Google/Facebook/Apple</text>
  <text x="140" y="154" text-anchor="middle" fill="#3b82f6" font-size="11">Authentification à deux facteurs 2FA TOTP</text>

  <rect x="265" y="72" width="220" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="96" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">Système de portefeuille</text>
  <text x="375" y="116" text-anchor="middle" fill="#ca8a04" font-size="11">Portefeuille de pièces de plateforme (verrou optimiste anti-concurrence)</text>
  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">Portefeuille de pièces de jeu (indépendant par jeu)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">Suivi complet des transactions de bout en bout</text>

  <rect x="500" y="72" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="96" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">Système de dépôt</text>
  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">Création d'une commande de dépôt</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Vérification des callbacks Stripe/PayPal</text>
  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">Crédit automatique + notification interne</text>

  <rect x="735" y="72" width="230" height="95" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="96" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="bold">Système de retrait</text>
  <text x="850" y="116" text-anchor="middle" fill="#ea580c" font-size="11">Demande → Vérification → Paiement</text>
  <text x="850" y="135" text-anchor="middle" fill="#ea580c" font-size="11">Interrupteur global / Limites KYC par palier</text>
  <text x="850" y="154" text-anchor="middle" fill="#ea580c" font-size="11">Seuil d'approbation automatique configurable</text>

  <rect x="30" y="182" width="220" height="95" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="206" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">Moteur de conversion</text>
  <text x="140" y="226" text-anchor="middle" fill="#8b5cf6" font-size="11">Conversion bidirectionnelle pièces plateforme ⇄ pièces de jeu</text>
  <text x="140" y="245" text-anchor="middle" fill="#8b5cf6" font-size="11">Devis en temps réel / gestion des taux</text>
  <text x="140" y="264" text-anchor="middle" fill="#8b5cf6" font-size="11">Revenus de la marge de la plateforme</text>

  <rect x="265" y="182" width="220" height="95" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="206" text-anchor="middle" fill="#831843" font-size="13" font-weight="bold">Gestion des jeux</text>
  <text x="375" y="226" text-anchor="middle" fill="#ec4899" font-size="11">CRUD + types maison/tiers</text>
  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">10 grandes catégories de jeux + gestion des serveurs</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">Suivi complet des sessions de jeu</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC Vérification d'identité</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">Soumission de la vérification + contrôle en back-office</text>
  <text x="610" y="245" text-anchor="middle" fill="#ef4444" font-size="11">Carte d'identité / Passeport / Permis de conduire</text>
  <text x="610" y="264" text-anchor="middle" fill="#ef4444" font-size="11">Système de trois niveaux de vérification</text>

  <rect x="735" y="182" width="230" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="206" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">Classements</text>
  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">Jour / Semaine / Mois / Tout temps</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Cache Redis + classement en temps réel</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">Push temps réel WebSocket (:8789)</text>

  <rect x="30" y="292" width="220" height="95" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="316" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="bold">Coupons</text>
  <text x="140" y="336" text-anchor="middle" fill="#10b981" font-size="11">Montant fixe / remise en pourcentage</text>
  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">Durée limitée / quantité limitée / suivi d'utilisation</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="316" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Système de parrainage</text>
  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">Génération d'un code de parrainage unique</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">Bonus d'inscription + commission sur les dépôts</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="316" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="bold">Système de gestion des risques</text>
  <text x="610" y="336" text-anchor="middle" fill="#f97316" font-size="11">Liste noire IP / alertes gros montants</text>
  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">Détection de fréquence / vitesse anormale</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">Internationalisation i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">4 langues en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">Tables de traduction + mécanisme de cache</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">Centre de notifications</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">Messages internes + notifications e-mail</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">Dépôt/Retrait/KYC/Coupons</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="426" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">Différenciation par pays</text>
  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">Configuration des paiements/retraits pour 8 pays</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">Montants minimums de dépôt différenciés</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">Analyse statistique</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">Instantanés quotidiens (5 types de métriques)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">Suivi des revenus de la plateforme</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Recherche plein texte</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Recherche Elasticsearch</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">Repli LIKE + synchronisation Scout</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">Résumé des capacités de la plateforme</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">Authentification · Portefeuille (verrou optimiste) · Dépôt (Stripe/PayPal) · Conversion (taux en temps réel) · Retrait (vérification/automatique) · KYC (3 niveaux)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">CRUD jeux (10 catégories + serveurs) · Classements (WebSocket temps réel) · Coupons · Parrainage (bonus inscription + commission) · Gestion des risques (4 types de règles)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">Notifications (interne + e-mail) · Différenciation par pays (8 pays) · Internationalisation (4 langues) · Statistiques (instantanés quotidiens + revenus) · Recherche plein texte (ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">Trois clients : Flutter Admin (15 pages) + Flutter Platform (10 pages) + HarmonyOS (5 pages)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">Déploiement : orchestration Docker Compose de 7 services + Nginx reverse proxy + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
