<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="800" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Глобальная игровая агрегационная платформа — схема безопасности (18 уровней эшелонированной защиты)</text>

  <!-- Layer 1-6 -->
  <rect x="15" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L1: CSP — политика безопасности контента</text>
  <text x="170" y="108" text-anchor="middle" fill="#ef4444" font-size="10">заголовок ответа Content-Security-Policy</text>
  <text x="170" y="122" text-anchor="middle" fill="#ef4444" font-size="10">X-Permitted-Cross-Domain-Policies</text>

  <rect x="340" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L2: CORS — контроль междоменного доступа</text>
  <text x="495" y="108" text-anchor="middle" fill="#ef4444" font-size="10">белый список Access-Control-Allow-Origin</text>
  <text x="495" y="122" text-anchor="middle" fill="#ef4444" font-size="10">обработка предварительных запросов OPTIONS</text>

  <rect x="665" y="68" width="320" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L3: белый список HTTP-методов</text>
  <text x="825" y="108" text-anchor="middle" fill="#ef4444" font-size="10">только GET/POST/PUT/DELETE/OPTIONS/HEAD</text>
  <text x="825" y="122" text-anchor="middle" fill="#ef4444" font-size="10">нестандартные методы — 405 Method Not Allowed</text>

  <!-- L4-L6 -->
  <rect x="15" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L4: SecurityFilter — блокировка атак</text>
  <text x="170" y="180" text-anchor="middle" fill="#dc2626" font-size="10">XSS / SQL-инъекции / CSRF / обход пути</text>
  <text x="170" y="194" text-anchor="middle" fill="#dc2626" font-size="10">обнаружение и блокировка инъекций команд</text>

  <rect x="340" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L5: RateLimit — ограничение частоты</text>
  <text x="495" y="180" text-anchor="middle" fill="#dc2626" font-size="10">скользящее окно Redis + атомарность Lua</text>
  <text x="495" y="194" text-anchor="middle" fill="#dc2626" font-size="10">вход:10/мин регистрация:5/мин общий:60/мин</text>

  <rect x="665" y="140" width="320" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L6: управление версиями API</text>
  <text x="825" y="180" text-anchor="middle" fill="#dc2626" font-size="10">проверка заголовка API-Version</text>
  <text x="825" y="194" text-anchor="middle" fill="#dc2626" font-size="10">по умолчанию v1, поддержка сосуществования версий</text>

  <!-- L7-L9 -->
  <rect x="15" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L7: аутентификация JWT</text>
  <text x="170" y="252" text-anchor="middle" fill="#ea580c" font-size="10">erikwang2013/jwt-webman</text>
  <text x="170" y="266" text-anchor="middle" fill="#ea580c" font-size="10">access_token 2ч + refresh_token 14д</text>

  <rect x="340" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L8: управление сессиями</text>
  <text x="495" y="252" text-anchor="middle" fill="#ea580c" font-size="10">ограничение параллельных сессий (максимум 3 токена)</text>
  <text x="495" y="266" text-anchor="middle" fill="#ea580c" font-size="10">чёрный список токенов + автоматическое вытеснение</text>

  <rect x="665" y="212" width="320" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L9: блокировка аккаунта</text>
  <text x="825" y="252" text-anchor="middle" fill="#ea580c" font-size="10">5 неудачных входов → блокировка на 15 минут</text>
  <text x="825" y="266" text-anchor="middle" fill="#ea580c" font-size="10">Redis account_lock:{username} 900с</text>

  <!-- L10-L12 -->
  <rect x="15" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L10: контроль прав RBAC</text>
  <text x="170" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">проверка прав с точностью method.path</text>
  <text x="170" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">кэш прав Redis на 60с</text>

  <rect x="340" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L11: клик-капча</text>
  <text x="495" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">erikwang2013/poster-php</text>
  <text x="495" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">обязательная проверка «человек или робот» при входе/регистрации</text>

  <rect x="665" y="284" width="320" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L12: аудит операций</text>
  <text x="825" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">полный журнал операций + определение 8 платформ</text>
  <text x="825" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">ipados/macos/windows/linux/ios/android/harmonyos/web</text>

  <!-- L13-L15 -->
  <rect x="15" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L13: шифрование транспортного уровня</text>
  <text x="170" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryption</text>
  <text x="170" y="410" text-anchor="middle" fill="#22c55e" font-size="10">AES-256-CBC + поддержка SM4</text>

  <rect x="340" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L14: шифрование уровня хранения</text>
  <text x="495" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryptable</text>
  <text x="495" y="410" text-anchor="middle" fill="#22c55e" font-size="10">автошифрование/дешифрование чувствительных полей + ротация ключей</text>

  <rect x="665" y="356" width="320" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L15: необратимые ID</text>
  <text x="825" y="396" text-anchor="middle" fill="#22c55e" font-size="10">Snowflake + кодирование Hashids</text>
  <text x="825" y="410" text-anchor="middle" fill="#22c55e" font-size="10">по ID нельзя восстановить объём/порядок данных</text>

  <!-- L16-L18 -->
  <rect x="15" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L16: оптимистичная блокировка кошелька</text>
  <text x="170" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">поле version + обнаружение параллельных обновлений</text>
  <text x="170" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">предотвращение параллельного списания/двойного зачисления</text>

  <rect x="340" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L17: проверка подписи платёжных колбэков</text>
  <text x="495" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">проверка подписи Webhook Stripe</text>
  <text x="495" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">проверка сообщений PayPal IPN</text>

  <rect x="665" y="428" width="320" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L18: точные вычисления с деньгами</text>
  <text x="825" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">bcmath — математика произвольной точности</text>
  <text x="825" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">decimal(18,4) — финансовая точность</text>

  <!-- Additional measures -->
  <rect x="15" y="504" width="970" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="526" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">Дополнительные меры безопасности</text>

  <rect x="30" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="553" text-anchor="middle" fill="#475569" font-size="11">bcrypt-хэширование паролей (cost=12)</text>
  <rect x="220" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="553" text-anchor="middle" fill="#475569" font-size="11">повторное подтверждение пароля (чувствительные операции)</text>
  <rect x="410" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="553" text-anchor="middle" fill="#475569" font-size="11">security.txt RFC 9116</text>
  <rect x="600" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="553" text-anchor="middle" fill="#475569" font-size="11">усиленная конфигурация Nginx</text>
  <rect x="790" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="553" text-anchor="middle" fill="#475569" font-size="11">метрики Prometheus</text>

  <rect x="30" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="583" text-anchor="middle" fill="#475569" font-size="11">изоляция контейнерами Docker</text>
  <rect x="220" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="583" text-anchor="middle" fill="#475569" font-size="11">безопасность передачи HTTPS/TLS</text>
  <rect x="410" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="583" text-anchor="middle" fill="#475569" font-size="11">пароли БД в .gitignore</text>
  <rect x="600" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="583" text-anchor="middle" fill="#475569" font-size="11">шифрование резервных копий + хранение 30 дней</text>
  <rect x="790" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="583" text-anchor="middle" fill="#475569" font-size="11">автоматические проверки безопасности CI/CD</text>

  <!-- Architecture flow -->
  <rect x="15" y="612" width="970" height="82" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="500" y="636" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">Эшелонированная защита (атакующий трафик → фильтрация по слоям)</text>
  <text x="60" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L1 CSP</text>
  <text x="120" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="145" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L2 CORS</text>
  <text x="200" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="225" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L3 Method</text>
  <text x="285" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="310" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L4 Filter</text>
  <text x="365" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="390" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L5 Limit</text>
  <text x="440" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="465" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L6 Version</text>
  <text x="525" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="550" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L7 JWT</text>
  <text x="600" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="625" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L8 Session</text>
  <text x="685" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="710" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L9 Lock</text>
  <text x="755" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="780" y="662" text-anchor="middle" fill="#22c55e" font-size="11">L10 RBAC</text>
  <text x="830" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="855" y="662" text-anchor="middle" fill="#22c55e" font-size="11">... L11-L18</text>
  <text x="935" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="950" y="662" text-anchor="middle" fill="#166534" font-size="11">OK</text>

  <text x="500" y="690" text-anchor="middle" fill="#991b1b" font-size="11">Запрос → CSP-заголовок → проверка CORS → белый список методов → фильтр атак → ограничение частоты → проверка версии → аутентификация JWT → проверка сессии → проверка блокировки → RBAC → журнал аудита → Controller</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="11">Компоненты безопасности: erikwang2013/jwt-webman · erikwang2013/encryption · erikwang2013/encryptable · erikwang2013/security-php · erikwang2013/poster-php · erikwang2013/hashids</text>
  <text x="500" y="762" text-anchor="middle" fill="#94a3b8" font-size="11">Соответствие: security.txt (RFC 9116) · Prometheus Metrics · журнал аудита операций · шифрование данных (AES-256-CBC) · платёжное соответствие (PCI-DSS)</text>
  <text x="500" y="790" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
