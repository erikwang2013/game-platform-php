<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="gradNew" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#faf5ff"/><stop offset="100%" stop-color="#f3e8ff"/></linearGradient>
    <linearGradient id="gradProvider" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#eff6ff"/><stop offset="100%" stop-color="#dbeafe"/></linearGradient>
  </defs>
  <rect width="960" height="800" fill="#ffffff"/>

  <rect x="0" y="0" width="960" height="56" fill="url(#hdr)"/>
  <text x="480" y="36" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">Plataforma de Jogos v2.0 — Expansão do ecossistema</text>

  <!-- Phase 1: Provider Layer -->
  <rect x="30" y="76" width="440" height="200" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="250" y="100" text-anchor="middle" fill="#1e40af" font-size="15" font-weight="bold">Fase 1: SDK de Provider de jogos</text>
  <rect x="50" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="145" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">GameProvider (abstração)</text><text x="145" y="152" text-anchor="middle" fill="#64748b" font-size="10">balance/bet/settle/refund</text>
  <rect x="260" y="115" width="190" height="45" rx="6" fill="#dbeafe"/><text x="355" y="138" text-anchor="middle" fill="#1e3a5f" font-size="12">Middleware ProviderAuth</text><text x="355" y="152" text-anchor="middle" fill="#64748b" font-size="10">HMAC-SHA256 + janela de 5 minutos</text>
  <rect x="50" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="145" y="194" text-anchor="middle" fill="#1e40af" font-size="11">SelfProvider</text><text x="145" y="208" text-anchor="middle" fill="#64748b" font-size="10">Transação de banco (SELECT FOR UPDATE)</text>
  <rect x="260" y="175" width="190" height="40" rx="6" fill="#bfdbfe"/><text x="355" y="194" text-anchor="middle" fill="#1e40af" font-size="11">ThirdPartyProvider</text><text x="355" y="208" text-anchor="middle" fill="#64748b" font-size="10">Guzzle HTTP + assinatura</text>
  <rect x="50" y="230" width="400" height="35" rx="6" fill="#93c5fd"/><text x="250" y="244" text-anchor="middle" fill="#fff" font-size="12">GameSessionService — heartbeat Redis + liquidação automática em 15 minutos</text>

  <!-- Phase 2: Operations -->
  <rect x="490" y="76" width="440" height="200" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="710" y="100" text-anchor="middle" fill="#166534" font-size="15" font-weight="bold">Fase 2: Suporte operacional</text>
  <rect x="510" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="605" y="135" text-anchor="middle" fill="#14532d" font-size="12">Sistema de tickets</text><text x="605" y="150" text-anchor="middle" fill="#64748b" font-size="10">C-side: criar/lista/responder</text><text x="605" y="163" text-anchor="middle" fill="#64748b" font-size="10">Admin: responder/fechar/atribuir</text>
  <rect x="720" y="115" width="190" height="55" rx="6" fill="#dcfce7"/><text x="815" y="135" text-anchor="middle" fill="#14532d" font-size="12">Verificação</text><text x="815" y="150" text-anchor="middle" fill="#64748b" font-size="10">Código de 6 dígitos por email + SMS</text><text x="815" y="163" text-anchor="middle" fill="#64748b" font-size="10">TTL de 10 minutos no Redis</text>
  <rect x="510" y="185" width="400" height="45" rx="6" fill="#bbf7d0"/><text x="710" y="204" text-anchor="middle" fill="#14532d" font-size="12">PushService — FCM / APNs / 华为推送</text><text x="710" y="252" text-anchor="middle" fill="#64748b" font-size="10">OAuth: +X(Twitter)/Microsoft/LinkedIn/GitHub (PKCE)</text><text x="710" y="218" text-anchor="middle" fill="#64748b" font-size="10">Modelo DeviceToken + integração NotificationService</text>

  <!-- Phase 3: Engagement -->
  <rect x="30" y="296" width="440" height="180" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="250" y="320" text-anchor="middle" fill="#92400e" font-size="15" font-weight="bold">Fase 3: Interação com usuários</text>
  <rect x="50" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="145" y="358" text-anchor="middle" fill="#78350f" font-size="12">Sistema VIP (5 níveis)</text><text x="145" y="373" text-anchor="middle" fill="#64748b" font-size="10">EXP: recarga/login/KYC/indicação</text><text x="145" y="386" text-anchor="middle" fill="#64748b" font-size="10">Descontos: câmbio 2-15% / tarifa 10-100%</text>
  <rect x="260" y="340" width="190" height="55" rx="6" fill="#fde68a"/><text x="355" y="358" text-anchor="middle" fill="#78350f" font-size="12">Sistema de conquistas</text><text x="355" y="373" text-anchor="middle" fill="#64748b" font-size="10">12 conquistas integradas</text><text x="355" y="386" text-anchor="middle" fill="#64748b" font-size="10">Orientado a eventos + rastreamento de progresso</text>
  <rect x="50" y="410" width="400" height="55" rx="6" fill="#fde68a"/><text x="250" y="430" text-anchor="middle" fill="#78350f" font-size="12">VipService: acúmulo de EXP + upgrade automático + cálculo de benefícios</text><text x="250" y="445" text-anchor="middle" fill="#64748b" font-size="10">AchievementService: julgamento de condições (contagem/soma/deduplicação/sequência)</text>
  <text x="250" y="468" text-anchor="middle" fill="#92400e" font-size="11" font-style="italic">ExchangeController / WithdrawController — integração de descontos VIP</text>

  <!-- Phase 4: Social -->
  <rect x="490" y="296" width="440" height="180" rx="10" fill="#fce7f3" stroke="#f9a8d4" stroke-width="2"/>
  <text x="710" y="320" text-anchor="middle" fill="#9d174d" font-size="15" font-weight="bold">Fase 4: Camada social</text>
  <rect x="510" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="605" y="358" text-anchor="middle" fill="#831843" font-size="12">Sistema de amigos</text><text x="605" y="373" text-anchor="middle" fill="#64748b" font-size="10">Solicitação/aceite/recusa/remoção</text><text x="605" y="386" text-anchor="middle" fill="#64748b" font-size="10">Pendente/aceito/bloqueado</text>
  <rect x="720" y="340" width="190" height="55" rx="6" fill="#fbcfe8"/><text x="815" y="358" text-anchor="middle" fill="#831843" font-size="12">Mensagens de chat</text><text x="815" y="373" text-anchor="middle" fill="#64748b" font-size="10">REST + WebSocket :8790</text><text x="815" y="386" text-anchor="middle" fill="#64748b" font-size="10">Mensagens apenas entre amigos</text>
  <rect x="510" y="410" width="400" height="55" rx="6" fill="#f9a8d4"/><text x="710" y="430" text-anchor="middle" fill="#831843" font-size="12">Processo ChatWebSocket — workerman WebSocket + Redis Pub/Sub</text><text x="710" y="445" text-anchor="middle" fill="#64748b" font-size="10">Tabela erik_friend + tabela erik_message</text>

  <!-- Phase 5: Infrastructure -->
  <rect x="30" y="496" width="900" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="480" y="520" text-anchor="middle" fill="#334155" font-size="15" font-weight="bold">Fase 5 + expansões P2/P3</text>
  <rect x="50" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="185" y="558" text-anchor="middle" fill="#334155" font-size="12">EventBus (Redis Pub/Sub)</text><text x="185" y="573" text-anchor="middle" fill="#64748b" font-size="10">user.registered / deposit.completed / game.played</text>
  <rect x="345" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="480" y="558" text-anchor="middle" fill="#334155" font-size="12">Análise avançada (ClickHouse)</text><text x="480" y="573" text-anchor="middle" fill="#64748b" font-size="10">Retenção D1-D30 / funil / ARPU / economia</text>
  <rect x="640" y="540" width="270" height="45" rx="6" fill="#e2e8f0"/><text x="775" y="558" text-anchor="middle" fill="#334155" font-size="12">FeatureFlag (baseado em banco)</text><text x="775" y="573" text-anchor="middle" fill="#64748b" font-size="10">tournament / chat / vip / achievements</text>
  <rect x="50" y="600" width="860" height="27" rx="6" fill="#94a3b8"/><text x="480" y="618" text-anchor="middle" fill="#fff" font-size="12">+10 novas tabelas  |  +51 novos arquivos  |  0 novas dependências  |  BC Math precisão de 8 dígitos  |  Totalmente compatível com versões anteriores</text>

  <!-- Database Summary -->
  <rect x="30" y="656" width="900" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="480" y="680" text-anchor="middle" fill="#334155" font-size="14" font-weight="bold">Banco de dados: 42 → 52 tabelas</text>
  <text x="480" y="700" text-anchor="middle" fill="#64748b" font-size="11">Novas: erik_ticket, erik_ticket_reply, erik_device_token, erik_vip_level, erik_user_vip, erik_exp_log, erik_achievement, erik_user_achievement, erik_friend, erik_message</text>
  <text x="480" y="716" text-anchor="middle" fill="#64748b" font-size="11">Modificadas: erik_game (+provider_config JSON), erik_game_play_log (+round_id, +bet_amount, +win_amount)</text>

  <!-- Footer -->
  <rect x="0" y="750" width="960" height="50" fill="#7c3aed"/>
  <text x="480" y="775" text-anchor="middle" fill="#ddd6fe" font-size="12">Copyright (c) 2026 erik — https://erik.xyz | Ecossistema da Plataforma de Jogos v2.0</text>
  <text x="480" y="792" text-anchor="middle" fill="#a78bfa" font-size="10">5 fases · 16 funcionalidades · 12 tabelas · zero novas dependências de terceiros</text>
</svg>
