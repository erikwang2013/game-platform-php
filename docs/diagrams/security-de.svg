<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#dc2626"/><stop offset="100%" stop-color="#ef4444"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="800" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Globale Spielaggregationsplattform — Sicherheitsarchitektur (18 Ebenen Defense-in-Depth)</text>

  <!-- Layer 1-6 -->
  <rect x="15" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L1: CSP Content Security Policy</text>
  <text x="170" y="108" text-anchor="middle" fill="#ef4444" font-size="10">Content-Security-Policy-Response-Header</text>
  <text x="170" y="122" text-anchor="middle" fill="#ef4444" font-size="10">X-Permitted-Cross-Domain-Policies</text>

  <rect x="340" y="68" width="310" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L2: CORS Cross-Origin-Kontrolle</text>
  <text x="495" y="108" text-anchor="middle" fill="#ef4444" font-size="10">Access-Control-Allow-Origin-Whitelist</text>
  <text x="495" y="122" text-anchor="middle" fill="#ef4444" font-size="10">OPTIONS-Preflight-Anfragen verarbeiten</text>

  <rect x="665" y="68" width="320" height="60" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="90" text-anchor="middle" fill="#991b1b" font-size="12" font-weight="bold">L3: HTTP-Methoden-Whitelist</text>
  <text x="825" y="108" text-anchor="middle" fill="#ef4444" font-size="10">Nur GET/POST/PUT/DELETE/OPTIONS/HEAD erlaubt</text>
  <text x="825" y="122" text-anchor="middle" fill="#ef4444" font-size="10">Nicht standardkonforme Methoden → 405 Method Not Allowed</text>

  <!-- L4-L6 -->
  <rect x="15" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L4: SecurityFilter-Angriffsabwehr</text>
  <text x="170" y="180" text-anchor="middle" fill="#dc2626" font-size="10">XSS / SQL-Injection / CSRF / Path-Traversal</text>
  <text x="170" y="194" text-anchor="middle" fill="#dc2626" font-size="10">Command-Injection-Erkennung und -Blockierung</text>

  <rect x="340" y="140" width="310" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L5: RateLimit-Frequenzbegrenzung</text>
  <text x="495" y="180" text-anchor="middle" fill="#dc2626" font-size="10">Redis-Sliding-Window + Lua atomar</text>
  <text x="495" y="194" text-anchor="middle" fill="#dc2626" font-size="10">Login: 10/Min. Registrierung: 5/Min. Allgemein: 60/Min.</text>

  <rect x="665" y="140" width="320" height="60" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="162" text-anchor="middle" fill="#7f1d1d" font-size="12" font-weight="bold">L6: URL-Versionierung</text>
  <text x="825" y="180" text-anchor="middle" fill="#dc2626" font-size="10">URL-Pfad-Versionierung (/api/v1)</text>
  <text x="825" y="194" text-anchor="middle" fill="#dc2626" font-size="10">Standard v1, Mehrfachversionen koexistieren</text>

  <!-- L7-L9 -->
  <rect x="15" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L7: JWT-Authentifizierung</text>
  <text x="170" y="252" text-anchor="middle" fill="#ea580c" font-size="10">erikwang2013/jwt-webman</text>
  <text x="170" y="266" text-anchor="middle" fill="#ea580c" font-size="10">access_token 2h + refresh_token 14d</text>

  <rect x="340" y="212" width="310" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L8: Session-Verwaltung</text>
  <text x="495" y="252" text-anchor="middle" fill="#ea580c" font-size="10">Begrenzung paralleler Sessions (max. 3 Tokens)</text>
  <text x="495" y="266" text-anchor="middle" fill="#ea580c" font-size="10">Token-Blacklist + automatische Verdrängung</text>

  <rect x="665" y="212" width="320" height="60" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="234" text-anchor="middle" fill="#9a3412" font-size="12" font-weight="bold">L9: Kontosperre</text>
  <text x="825" y="252" text-anchor="middle" fill="#ea580c" font-size="10">5 fehlgeschlagene Logins → 15 Minuten Sperre</text>
  <text x="825" y="266" text-anchor="middle" fill="#ea580c" font-size="10">Redis account_lock:{username} 900s</text>

  <!-- L10-L12 -->
  <rect x="15" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L10: RBAC-Berechtigungskontrolle</text>
  <text x="170" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">method.path-granulare Berechtigungsprüfung</text>
  <text x="170" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">Redis 60s-Berechtigungscache</text>

  <rect x="340" y="284" width="310" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L11: Klick-Captcha</text>
  <text x="495" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">erikwang2013/poster-php</text>
  <text x="495" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">Mensch-Roboter-Verifizierung bei Login/Registrierung</text>

  <rect x="665" y="284" width="320" height="60" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="306" text-anchor="middle" fill="#854d0e" font-size="12" font-weight="bold">L12: Operations-Audit</text>
  <text x="825" y="324" text-anchor="middle" fill="#ca8a04" font-size="10">Vollständige Operations-Logs + Erkennung von 8 Plattform-Quellen</text>
  <text x="825" y="338" text-anchor="middle" fill="#ca8a04" font-size="10">ipados/macos/windows/linux/ios/android/harmonyos/web</text>

  <!-- L13-L15 -->
  <rect x="15" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L13: Transportverschlüsselung</text>
  <text x="170" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryption</text>
  <text x="170" y="410" text-anchor="middle" fill="#22c55e" font-size="10">AES-256-CBC + SM4-China-Standardunterstützung</text>

  <rect x="340" y="356" width="310" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L14: Speicherverschlüsselung</text>
  <text x="495" y="396" text-anchor="middle" fill="#22c55e" font-size="10">erikwang2013/encryptable</text>
  <text x="495" y="410" text-anchor="middle" fill="#22c55e" font-size="10">Automatische Ver-/Entschlüsselung sensibler Felder + Schlüsselrotation</text>

  <rect x="665" y="356" width="320" height="60" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="378" text-anchor="middle" fill="#166534" font-size="12" font-weight="bold">L15: IDs nicht rückrechenbar</text>
  <text x="825" y="396" text-anchor="middle" fill="#22c55e" font-size="10">Snowflake-Generierung + Hashids-Kodierung</text>
  <text x="825" y="410" text-anchor="middle" fill="#22c55e" font-size="10">Außenstehende können Datenmenge/Reihenfolge nicht aus IDs ableiten</text>

  <!-- L16-L18 -->
  <rect x="15" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="170" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L16: Wallet-Optimistic-Lock</text>
  <text x="170" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">version-Feld + Nebenläufigkeits-Update-Erkennung</text>
  <text x="170" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">Verhindert parallele Abbuchung/doppelte Gutschrift</text>

  <rect x="340" y="428" width="310" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="495" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L17: Zahlungs-Callback-Verifizierung</text>
  <text x="495" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">Stripe/Alipay/WeChat Pay-Webhook-Signaturprüfung</text>
  <text x="495" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">PayPal-IPN-Nachrichtenverifizierung</text>
  <text x="495" y="496" text-anchor="middle" fill="#3b82f6" font-size="10">NOWPayments/Coinbase-Callback-Signaturprüfung</text>

  <rect x="665" y="428" width="320" height="60" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="825" y="450" text-anchor="middle" fill="#1e40af" font-size="12" font-weight="bold">L18: Präzise Datenberechnung</text>
  <text x="825" y="468" text-anchor="middle" fill="#3b82f6" font-size="10">bcmath-Arbiträrpräzisions-Mathematik</text>
  <text x="825" y="482" text-anchor="middle" fill="#3b82f6" font-size="10">decimal(18,4) Finanzpräzision</text>

  <!-- Additional measures -->
  <rect x="15" y="504" width="970" height="90" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="526" text-anchor="middle" fill="#475569" font-size="13" font-weight="bold">Ergänzende Sicherheitsmaßnahmen</text>

  <rect x="30" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="553" text-anchor="middle" fill="#475569" font-size="11">bcrypt-Passwort-Hash (cost=12)</text>
  <rect x="220" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="553" text-anchor="middle" fill="#475569" font-size="11">Passwort-Bestätigung (sensible Operationen)</text>
  <rect x="410" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="553" text-anchor="middle" fill="#475569" font-size="11">security.txt RFC 9116</text>
  <rect x="600" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="553" text-anchor="middle" fill="#475569" font-size="11">Nginx-Sicherheitshärtung</text>
  <rect x="790" y="536" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="553" text-anchor="middle" fill="#475569" font-size="11">Prometheus-Überwachungsmetriken</text>

  <rect x="30" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="120" y="583" text-anchor="middle" fill="#475569" font-size="11">Docker-Container-Isolation</text>
  <rect x="220" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="310" y="583" text-anchor="middle" fill="#475569" font-size="11">HTTPS/TLS-Transport-Sicherheit</text>
  <rect x="410" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="500" y="583" text-anchor="middle" fill="#475569" font-size="11">DB-Passwörter in .gitignore</text>
  <rect x="600" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="690" y="583" text-anchor="middle" fill="#475569" font-size="11">Backup-Verschlüsselung + 30 Tage Aufbewahrung</text>
  <rect x="790" y="566" width="180" height="24" rx="4" fill="#f1f5f9"/><text x="880" y="583" text-anchor="middle" fill="#475569" font-size="11">Automatisierte Sicherheitschecks in CI/CD</text>

  <!-- Architecture flow -->
  <rect x="15" y="612" width="970" height="82" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="500" y="636" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">Defense-in-Depth-Architektur (Angriffs-Traffic → schichtweise Filterung)</text>
  <text x="60" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L1 CSP</text>
  <text x="120" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="145" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L2 CORS</text>
  <text x="200" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="225" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L3 Method</text>
  <text x="285" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="310" y="662" text-anchor="middle" fill="#dc2626" font-size="11">L4 Filter</text>
  <text x="365" y="662" fill="#dc2626" font-size="11">→</text>
  <text x="390" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L5 Limit</text>
  <text x="440" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="465" y="662" text-anchor="middle" fill="#ea580c" font-size="11">L6 Version</text>
  <text x="525" y="662" fill="#ea580c" font-size="11">→</text>
  <text x="550" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L7 JWT</text>
  <text x="600" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="625" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L8 Session</text>
  <text x="685" y="662" fill="#ca8a04" font-size="11">→</text>
  <text x="710" y="662" text-anchor="middle" fill="#ca8a04" font-size="11">L9 Lock</text>
  <text x="755" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="780" y="662" text-anchor="middle" fill="#22c55e" font-size="11">L10 RBAC</text>
  <text x="830" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="855" y="662" text-anchor="middle" fill="#22c55e" font-size="11">... L11-L18</text>
  <text x="935" y="662" fill="#22c55e" font-size="11">→</text>
  <text x="950" y="662" text-anchor="middle" fill="#166534" font-size="11">OK</text>

  <text x="500" y="690" text-anchor="middle" fill="#991b1b" font-size="11">Anfrage → CSP-Header → CORS-Prüfung → Methoden-Whitelist → Angriffsfilterung → Rate-Limit → Versionsprüfung → JWT-Authentifizierung → Session-Check → Sperr-Check → RBAC → Audit-Log → Controller</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="11">Sicherheitskomponenten: erikwang2013/jwt-webman · erikwang2013/encryption · erikwang2013/encryptable · erikwang2013/security-php · erikwang2013/poster-php · erikwang2013/hashids</text>
  <text x="500" y="762" text-anchor="middle" fill="#94a3b8" font-size="11">Compliance: security.txt (RFC 9116) · Prometheus-Metriken · Operations-Audit-Logs · Datenverschlüsselung (AES-256-CBC) · Zahlungs-Compliance (PCI-DSS)</text>
  <text x="500" y="790" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
