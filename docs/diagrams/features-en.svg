<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="750" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Global Game Aggregation Platform — Feature Overview</text>

  <rect x="30" y="72" width="220" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="96" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">User Auth</text>
  <text x="140" y="116" text-anchor="middle" fill="#3b82f6" font-size="11">Username/password login &amp; register</text>
  <text x="140" y="135" text-anchor="middle" fill="#3b82f6" font-size="11">Google/Facebook/Apple OAuth</text>
  <text x="140" y="154" text-anchor="middle" fill="#3b82f6" font-size="11">2FA TOTP two-factor auth</text>

  <rect x="265" y="72" width="220" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="96" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">Wallet System</text>
  <text x="375" y="116" text-anchor="middle" fill="#ca8a04" font-size="11">Platform currency wallet (optimistic lock)</text>
  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">Game currency wallet (per game)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">Full transaction trail tracking</text>

  <rect x="500" y="72" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="96" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">Deposit System</text>
  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">Create deposit order</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Stripe/PayPal/Alipay/WeChat Pay callback verification</text>
  <text x="610" y="174" text-anchor="middle" fill="#22c55e" font-size="10">NOWPayments/Coinbase callback verification</text>
  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">Auto credit + in-app notification</text>

  <rect x="735" y="72" width="230" height="95" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="96" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="bold">Withdrawal System</text>
  <text x="850" y="116" text-anchor="middle" fill="#ea580c" font-size="11">Apply → Review → Transfer</text>
  <text x="850" y="135" text-anchor="middle" fill="#ea580c" font-size="11">Global switch / KYC tiered limits</text>
  <text x="850" y="154" text-anchor="middle" fill="#ea580c" font-size="11">Configurable auto-review threshold</text>

  <rect x="30" y="182" width="220" height="95" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="206" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">Exchange Engine</text>
  <text x="140" y="226" text-anchor="middle" fill="#8b5cf6" font-size="11">Platform ⇄ game currency two-way</text>
  <text x="140" y="245" text-anchor="middle" fill="#8b5cf6" font-size="11">Real-time quote / rate management</text>
  <text x="140" y="264" text-anchor="middle" fill="#8b5cf6" font-size="11">Platform spread revenue</text>

  <rect x="265" y="182" width="220" height="95" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="206" text-anchor="middle" fill="#831843" font-size="13" font-weight="bold">Game Management</text>
  <text x="375" y="226" text-anchor="middle" fill="#ec4899" font-size="11">CRUD + self/third-party types</text>
  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">10 categories + server management</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">Full play-log tracking</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC Verification</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">Submission + admin review</text>
  <text x="610" y="245" text-anchor="middle" fill="#ef4444" font-size="11">ID / passport / driver's license</text>
  <text x="610" y="264" text-anchor="middle" fill="#ef4444" font-size="11">Three-tier verification levels</text>

  <rect x="735" y="182" width="230" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="206" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">Leaderboards</text>
  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">Daily / weekly / monthly / total</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Redis cache + real-time ranking</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">WebSocket push (:8789)</text>

  <rect x="30" y="292" width="220" height="95" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="316" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="bold">Coupons</text>
  <text x="140" y="336" text-anchor="middle" fill="#10b981" font-size="11">Fixed amount / percentage discount</text>
  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">Time/quantity limited, claim tracking</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="316" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Referral System</text>
  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">Unique referral code generation</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">Signup reward + deposit commission</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="316" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="bold">Risk Control</text>
  <text x="610" y="336" text-anchor="middle" fill="#f97316" font-size="11">IP blacklist / large-amount alerts</text>
  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">Frequency / velocity detection</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">4 languages en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">Translation table + cache</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">Notification Center</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">In-app + email notifications</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">Deposit/withdraw/KYC/coupon</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="426" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">Country Differentiation</text>
  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">8-country payment/withdraw config</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">Differentiated min deposit</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">Analytics</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">Daily stats snapshot (5 metrics)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">Platform revenue tracking</text>
  <text x="610" y="484" text-anchor="middle" fill="#a855f7" font-size="11">Reports · Platform stats</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Full-Text Search</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Elasticsearch search</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">LIKE fallback + Scout sync</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">Platform Capability Summary</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">User auth · Wallet (optimistic lock) · Deposit (Stripe/PayPal/Alipay/WeChat Pay) · Exchange (real-time rate) · Withdrawal (review/auto) · KYC (3 tiers)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">Game CRUD (10 categories + servers) · Leaderboards (WebSocket real-time) · Coupons · Referrals (signup reward + commission) · Risk control (4 rule types)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">Notifications (in-app + email) · Country differentiation (8 countries) · i18n (4 languages) · Analytics (daily snapshot + revenue) · Full-text search (ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">Three clients: Flutter Admin (15 pages) + Flutter Platform (10 pages) + HarmonyOS (5 pages)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">Deployment: Docker Compose 7 services + Nginx reverse proxy + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
