<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" font-family="Arial, 'Noto Sans SC', 'Noto Sans', sans-serif">
  <defs>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="1.5" flood-opacity=".06"/></filter>
  </defs>
  <rect width="1000" height="750" fill="#fafbfc"/>

  <rect x="0" y="0" width="1000" height="52" fill="url(#hd)"/>
  <text x="500" y="34" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Plataforma global de agregación de juegos — Panorama de funcionalidades</text>

  <rect x="30" y="72" width="220" height="95" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="96" text-anchor="middle" fill="#1e40af" font-size="13" font-weight="bold">Autenticación de usuarios</text>
  <text x="140" y="116" text-anchor="middle" fill="#3b82f6" font-size="11">Registro/inicio de sesión con usuario/contraseña</text>
  <text x="140" y="135" text-anchor="middle" fill="#3b82f6" font-size="11">OAuth Google/Facebook/Apple</text>
  <text x="140" y="154" text-anchor="middle" fill="#3b82f6" font-size="11">Autenticación de dos factores 2FA TOTP</text>

  <rect x="265" y="72" width="220" height="95" rx="8" fill="#fefce8" stroke="#fde68a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="96" text-anchor="middle" fill="#854d0e" font-size="13" font-weight="bold">Sistema de billetera</text>
  <text x="375" y="116" text-anchor="middle" fill="#ca8a04" font-size="11">Billetera de moneda de plataforma (bloqueo optimista anti-concurrencia)</text>
  <text x="375" y="135" text-anchor="middle" fill="#ca8a04" font-size="11">Billetera de moneda de juego (independiente por juego)</text>
  <text x="375" y="154" text-anchor="middle" fill="#ca8a04" font-size="11">Seguimiento de movimientos de toda la cadena</text>

  <rect x="500" y="72" width="220" height="95" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="96" text-anchor="middle" fill="#166534" font-size="13" font-weight="bold">Sistema de recargas</text>
  <text x="610" y="116" text-anchor="middle" fill="#22c55e" font-size="11">Creación de órdenes de recarga</text>
  <text x="610" y="135" text-anchor="middle" fill="#22c55e" font-size="11">Verificación de firma de callbacks Stripe/PayPal</text>
  <text x="610" y="174" text-anchor="middle" fill="#22c55e" font-size="10">Verificación de firma de callbacks NOWPayments/Coinbase</text>
  <text x="610" y="154" text-anchor="middle" fill="#22c55e" font-size="11">Abono automático + notificación interna</text>

  <rect x="735" y="72" width="230" height="95" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="96" text-anchor="middle" fill="#9a3412" font-size="13" font-weight="bold">Sistema de retiros</text>
  <text x="850" y="116" text-anchor="middle" fill="#ea580c" font-size="11">Solicitud → revisión → pago</text>
  <text x="850" y="135" text-anchor="middle" fill="#ea580c" font-size="11">Interruptor global / límites escalonados KYC</text>
  <text x="850" y="154" text-anchor="middle" fill="#ea580c" font-size="11">Umbral de revisión automática configurable</text>

  <rect x="30" y="182" width="220" height="95" rx="8" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="206" text-anchor="middle" fill="#5b21b6" font-size="13" font-weight="bold">Motor de conversión</text>
  <text x="140" y="226" text-anchor="middle" fill="#8b5cf6" font-size="11">Conversión bidireccional plataforma ⇄ juego</text>
  <text x="140" y="245" text-anchor="middle" fill="#8b5cf6" font-size="11">Cotización en tiempo real / gestión de tipos de cambio</text>
  <text x="140" y="264" text-anchor="middle" fill="#8b5cf6" font-size="11">Ingresos por diferencial de la plataforma</text>

  <rect x="265" y="182" width="220" height="95" rx="8" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="206" text-anchor="middle" fill="#831843" font-size="13" font-weight="bold">Gestión de juegos</text>
  <text x="375" y="226" text-anchor="middle" fill="#ec4899" font-size="11">CRUD + tipos propio/tercero</text>
  <text x="375" y="245" text-anchor="middle" fill="#ec4899" font-size="11">10 grandes categorías de juegos + gestión de servidores</text>
  <text x="375" y="264" text-anchor="middle" fill="#ec4899" font-size="11">Seguimiento completo de registros de juego</text>

  <rect x="500" y="182" width="220" height="95" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="206" text-anchor="middle" fill="#991b1b" font-size="13" font-weight="bold">KYC — verificación de identidad</text>
  <text x="610" y="226" text-anchor="middle" fill="#ef4444" font-size="11">Envío de verificación de identidad + revisión en el panel</text>
  <text x="610" y="245" text-anchor="middle" fill="#ef4444" font-size="11">DNI / pasaporte / carné de conducir</text>
  <text x="610" y="264" text-anchor="middle" fill="#ef4444" font-size="11">Sistema de tres niveles de verificación</text>

  <rect x="735" y="182" width="230" height="95" rx="8" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="206" text-anchor="middle" fill="#4c1d95" font-size="13" font-weight="bold">Clasificaciones</text>
  <text x="850" y="226" text-anchor="middle" fill="#7c3aed" font-size="11">Día / semana / mes / total</text>
  <text x="850" y="245" text-anchor="middle" fill="#7c3aed" font-size="11">Caché Redis + ordenación en tiempo real</text>
  <text x="850" y="264" text-anchor="middle" fill="#7c3aed" font-size="11">Push en tiempo real por WebSocket (:8789)</text>

  <rect x="30" y="292" width="220" height="95" rx="8" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="316" text-anchor="middle" fill="#064e3b" font-size="13" font-weight="bold">Cupones</text>
  <text x="140" y="336" text-anchor="middle" fill="#10b981" font-size="11">Importe fijo / descuento porcentual</text>
  <text x="140" y="355" text-anchor="middle" fill="#10b981" font-size="11">Limitados por tiempo y cantidad / seguimiento de reclamo y uso</text>

  <rect x="265" y="292" width="220" height="95" rx="8" fill="#fff1f2" stroke="#fda4af" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="316" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Sistema de recomendación</text>
  <text x="375" y="336" text-anchor="middle" fill="#f43f5e" font-size="11">Generación de código de recomendación único</text>
  <text x="375" y="355" text-anchor="middle" fill="#f43f5e" font-size="11">Recompensa de registro + comisión por recarga</text>

  <rect x="500" y="292" width="220" height="95" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="316" text-anchor="middle" fill="#7c2d12" font-size="13" font-weight="bold">Sistema de control de riesgos</text>
  <text x="610" y="336" text-anchor="middle" fill="#f97316" font-size="11">Lista negra de IP / alerta de importes grandes</text>
  <text x="610" y="355" text-anchor="middle" fill="#f97316" font-size="11">Detección de frecuencia / anomalías de velocidad</text>

  <rect x="735" y="292" width="230" height="95" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="316" text-anchor="middle" fill="#334155" font-size="13" font-weight="bold">Internacionalización i18n</text>
  <text x="850" y="336" text-anchor="middle" fill="#64748b" font-size="11">4 idiomas en/zh/ja/ko</text>
  <text x="850" y="355" text-anchor="middle" fill="#64748b" font-size="11">Tabla de traducciones + mecanismo de caché</text>

  <rect x="30" y="402" width="220" height="95" rx="8" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1.5" filter="url(#sh)"/>
  <text x="140" y="426" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="bold">Centro de notificaciones</text>
  <text x="140" y="446" text-anchor="middle" fill="#0ea5e9" font-size="11">Mensajes internos + notificaciones por email</text>
  <text x="140" y="465" text-anchor="middle" fill="#0ea5e9" font-size="11">Recarga/retiro/KYC/cupones</text>

  <rect x="265" y="402" width="220" height="95" rx="8" fill="#fefce8" stroke="#fef08a" stroke-width="1.5" filter="url(#sh)"/>
  <text x="375" y="426" text-anchor="middle" fill="#713f12" font-size="13" font-weight="bold">Diferenciación por país</text>
  <text x="375" y="446" text-anchor="middle" fill="#eab308" font-size="11">Configuración de pagos/retiros en 8 países</text>
  <text x="375" y="465" text-anchor="middle" fill="#eab308" font-size="11">Importes mínimos de recarga diferenciados</text>

  <rect x="500" y="402" width="220" height="95" rx="8" fill="#f5f3ff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#sh)"/>
  <text x="610" y="426" text-anchor="middle" fill="#581c87" font-size="13" font-weight="bold">Análisis estadístico</text>
  <text x="610" y="446" text-anchor="middle" fill="#a855f7" font-size="11">Instantáneas diarias (5 tipos de métricas)</text>
  <text x="610" y="465" text-anchor="middle" fill="#a855f7" font-size="11">Seguimiento de ingresos de la plataforma</text>

  <rect x="735" y="402" width="230" height="95" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5" filter="url(#sh)"/>
  <text x="850" y="426" text-anchor="middle" fill="#881337" font-size="13" font-weight="bold">Búsqueda de texto completo</text>
  <text x="850" y="446" text-anchor="middle" fill="#e11d48" font-size="11">Búsqueda Elasticsearch</text>
  <text x="850" y="465" text-anchor="middle" fill="#e11d48" font-size="11">Fallback LIKE + sincronización Scout</text>

  <rect x="30" y="518" width="940" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="500" y="546" text-anchor="middle" fill="#475569" font-size="14" font-weight="bold">Resumen de capacidades de la plataforma</text>
  <text x="500" y="572" text-anchor="middle" fill="#64748b" font-size="12">Autenticación · Billetera (bloqueo optimista) · Recarga (Stripe/PayPal) · Conversión (tipo de cambio en tiempo real) · Retiro (revisión/automático) · KYC (verificación en tres niveles)</text>
  <text x="500" y="594" text-anchor="middle" fill="#64748b" font-size="12">CRUD de juegos (10 categorías+servidores) · Clasificaciones (WebSocket en tiempo real) · Cupones · Recomendación (recompensa de registro+comisión) · Control de riesgos (4 tipos de reglas)</text>
  <text x="500" y="616" text-anchor="middle" fill="#64748b" font-size="12">Notificaciones (internas+email) · Diferenciación por país (8 países) · i18n (4 idiomas) · Estadísticas (instantáneas diarias+ingresos) · Búsqueda de texto completo (ES)</text>

  <text x="500" y="662" text-anchor="middle" fill="#94a3b8" font-size="11">Clientes en tres extremos: Flutter Admin (15 páginas) + Flutter Platform (10 páginas) + HarmonyOS (5 páginas)</text>
  <text x="500" y="682" text-anchor="middle" fill="#94a3b8" font-size="11">Despliegue: orquestación Docker Compose con 7 servicios + proxy inverso Nginx + CI/CD (GitHub Actions)</text>

  <text x="500" y="740" text-anchor="middle" fill="#94a3b8" font-size="10">Copyright (c) 2026 erik &lt;erik@erik.xyz&gt;</text>
</svg>
